<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 粒子形态变换手势控制</title>
    <!-- 引入 MediaPipe 库 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000; /* 纯黑背景更酷炫 */
            font-family: 'Inter', sans-serif;
            color: white;
        }
        canvas {
            display: block;
        }
        /* 确保 Three.js 渲染的 Canvas 填满整个屏幕并位于底层 */
        body > canvas:not(#output_canvas) {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 5; 
            /* 粒子现在会更亮，在纯黑背景下效果更佳 */
            filter: drop-shadow(0 0 5px rgba(0, 255, 255, 0.8)) drop-shadow(0 0 15px rgba(255, 0, 255, 0.4));
        }
        /* ---------------- UI 元素 ---------------- */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: auto;
            text-align: left;
            pointer-events: none; 
            z-index: 10;
        }
        h1 {
            font-size: 2.2rem;
            margin: 0;
            background: linear-gradient(90deg, #00FFFF, #FF00FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0,255,255,0.5);
        }
        .mode-display {
            font-size: 3rem;
            font-weight: bold;
            margin-top: 15px;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
            transition: color 0.3s, text-shadow 0.3s;
        }
        .instruction-list {
            margin-top: 25px;
            font-size: 1rem;
            color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.6);
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #00FFFF;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }
        .instruction-item {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        .key {
            font-weight: bold;
            color: #FFD700;
            margin-right: 12px;
            width: 40px;
            font-size: 1.2rem;
        }
        /* ---------------- 摄像头预览窗口 (保持微小，不影响酷炫效果) ---------------- */
        #camera-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 180px; /* 减小尺寸 */
            height: 135px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid rgba(0, 255, 255, 0.4);
            z-index: 20;
            background: #000;
            transform: scaleX(-1); 
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        #input_video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block; 
            position: absolute;
            opacity: 0.1; /* 几乎隐藏视频流，只显示骨骼 */
        }
        #output_canvas {
            width: 100%;
            height: 100%;
            display: block;
            position: relative;
        }
        /* 加载和调试状态 */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: #00FFFF;
            text-shadow: 0 0 15px #00FFFF;
            z-index: 100;
            display: block;
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border-radius: 15px;
            max-width: 80%;
            text-align: center;
            border: 2px solid #FF00FF;
        }
    </style>
</head>
<body>

    <div id="loading">
        ✨ 正在启动形态魔法引擎 V6.0... 
        <br>
        <small>（启动摄像头中...）</small>
    </div>

    <div id="ui-container">
        <h1>形态魔法力场 V6.0</h1>
        <div id="current-mode" class="mode-display" style="color:#00FFFF;">等待手势...</div>
        
        <div class="instruction-list">
            <div class="instruction-item"><span class="key">☝️</span> 1指 · 陆之形 (蓝色)</div>
            <div class="instruction-item"><span class="key">✌️</span> 2指 · 知之形 (紫色)</div>
            <div class="instruction-item"><span class="key">🤟</span> 3指 · 舟之形 (红色)</div>
            <div class="instruction-item"><span class="key">🖐️</span> 4+指 · 生日快乐! (金色)</div>
        </div>
    </div>

    <!-- 摄像头预览区域 -->
    <div id="camera-container">
        <video id="input_video" playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script>
        // --- 全局常量 ---
        const PARTICLE_COUNT = 2500;
        const SHAPE_SCALE = 350; // 汉字形态的缩放比例
        const LERP_SPEED = 0.08; // 形态变换速度

        // --- Three.js 变量 ---
        let scene, camera, renderer, particles;
        let originalPositions = []; // 默认球体位置
        let currentTargetPoints = []; // 目标形状的坐标 {x, y, z}
        let particleInitialPositions = []; // 粒子当前位置（用于动画插值）
        
        // 旋转/动画控制
        let targetRotationY = 0.0;
        let finalRotationY = 0.0;
        let time = 0;
        let particleSize = 10;
        
        // 颜色目标 (RGB)
        let currentColor = { r: 0.2, g: 0.8, b: 1.0 }; 
        let targetColor = { r: 0.2, g: 0.8, b: 1.0 };

        // MediaPipe DOM 元素
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingElement = document.getElementById('loading');
        let hands;

        // -----------------------------------------------------------
        // 1. 汉字形态点定义
        // -----------------------------------------------------------

        /**
         * 定义中文字符/短语的线条路径。
         * 每个形状是一个线条数组，每个线条是 [x, y] 坐标对的数组 (归一化到 -100 到 100)
         */
        const ShapePaths = {
            // 陆 (Lù) - 简化结构
            '陆': [
                // 左侧 "阝" (耳刀旁)
                [[-100, 70], [-100, -70], [-80, -90], [-60, -70]], 
                // 右侧 "坴" 上部 "土"
                [[0, 70], [50, 70]],
                [[25, 70], [25, 30]],
                // 右侧 "坴" 下部 "大"
                [[25, 30], [25, -90]],
                [[25, 0], [-50, 0]],
                [[25, 0], [100, 0]],
            ],
            // 知 (Zhī) - 简化结构
            '知': [
                // 左侧 "矢"
                [[ -80, 70], [ 80, 70]], // 横
                [[0, 70], [0, -20]], // 竖
                [[ -80, -20], [ 80, -20]], // 横
                [[ -50, -50], [ 50, -50]], // 横
                // 右侧 "口"
                [[50, 30], [100, 30], [100, -20], [50, -20], [50, 30]]
            ],
            // 舟 (Zhōu) - 船形
            '舟': [
                // 船体外轮廓
                [[-100, -50], [-70, 0], [70, 0], [100, -50], [50, -90], [-50, -90], [-100, -50]],
                // 中部结构
                [[-50, 30], [50, 30]],
                [[-30, 30], [-30, -50]],
                [[30, 30], [30, -50]]
            ],
            // 生日快乐
            '生日快乐': [
                [[-150, 80], [-100, 80], [-150, 0], [-100, 0], [-150, -80], [-100, -80]], // 生
                [[-50, 80], [0, 80], [-50, 0], [0, 0], [-50, -80], [0, -80]], // 日
                [[50, 80], [100, 80], [75, 80], [75, 0], [50, -80], [100, -80], [75, -80]], // 快
                [[150, 80], [200, 80], [175, 80], [175, -80]] // 乐 (简化)
            ]
        };

        /**
         * 根据形状生成 PARTICLE_COUNT 个 3D 坐标点。
         * @param {string} shapeKey - 形状名称 (e.g., '陆', '生日快乐').
         * @returns {Array<{x: number, y: number, z: number}>} - 目标点集。
         */
        function generateShapePoints(shapeKey) {
            const paths = ShapePaths[shapeKey];
            if (!paths) return [];

            let totalLength = 0;
            const segmentLengths = [];

            // 1. 计算所有路径的总长度
            paths.forEach(path => {
                let pathLength = 0;
                for (let i = 0; i < path.length - 1; i++) {
                    const [x1, y1] = path[i];
                    const [x2, y2] = path[i + 1];
                    pathLength += Math.hypot(x2 - x1, y2 - y1);
                }
                segmentLengths.push(pathLength);
                totalLength += pathLength;
            });

            if (totalLength === 0) return [];

            // 2. 根据长度比例分配粒子
            const targetPoints = [];
            let currentParticleIndex = 0;

            paths.forEach((path, pathIndex) => {
                const numParticlesForPath = Math.round(PARTICLE_COUNT * (segmentLengths[pathIndex] / totalLength));
                const lengthPerParticle = segmentLengths[pathIndex] / numParticlesForPath;
                let accumulatedLength = 0;

                for (let i = 0; i < path.length - 1; i++) {
                    const [x1, y1] = path[i];
                    const [x2, y2] = path[i + 1];
                    const segmentLength = Math.hypot(x2 - x1, y2 - y1);
                    const angle = Math.atan2(y2 - y1, x2 - x1);
                    
                    let numParticlesInSegment = Math.round(segmentLength / lengthPerParticle);
                    // 确保不会超出总分配给该路径的粒子数
                    if (currentParticleIndex + numParticlesInSegment > numParticlesForPath) {
                        numParticlesInSegment = numParticlesForPath - currentParticleIndex;
                    }

                    for (let j = 0; j < numParticlesInSegment; j++) {
                        if (targetPoints.length >= PARTICLE_COUNT) break;

                        // 线性插值
                        const t = j / (numParticlesInSegment > 1 ? numParticlesInSegment - 1 : 1);
                        const x = x1 + (x2 - x1) * t;
                        const y = y1 + (y2 - y1) * t;
                        
                        // Z轴随机深度，增加 3D 立体感
                        const z = Math.random() * 50 - 25; 

                        targetPoints.push({
                            x: x * SHAPE_SCALE / 100, // 缩放并映射到 Three.js 坐标
                            y: y * SHAPE_SCALE / 100,
                            z: z
                        });
                    }
                    currentParticleIndex += numParticlesInSegment;
                }
            });
            
            // 如果粒子数量不足，用随机的 Z 轴位置补足
            while (targetPoints.length < PARTICLE_COUNT) {
                targetPoints.push({
                    x: (Math.random() - 0.5) * SHAPE_SCALE,
                    y: (Math.random() - 0.5) * SHAPE_SCALE,
                    z: (Math.random() - 0.5) * SHAPE_SCALE / 2
                });
            }

            // 随机打乱目标点，确保平滑过渡
            targetPoints.sort(() => Math.random() - 0.5);
            return targetPoints.slice(0, PARTICLE_COUNT); // 确保不多不少 PARTICLE_COUNT 个
        }


        // -----------------------------------------------------------
        // 2. Three.js 初始化与核心动画
        // -----------------------------------------------------------
        function initThreeJS() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0008); 

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 3000);
            camera.position.z = 1000;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false }); 
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 材质 (更大的尺寸, 更好的融合)
            const particleMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 15, // 粒子增大
                map: getSprite(),
                blending: THREE.AdditiveBlending,
                depthTest: false,
                transparent: true,
                opacity: 0.9,
                vertexColors: true
            });

            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const colorObj = new THREE.Color();
            
            // 默认的球形形态
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const radius = 600 + Math.random() * 100;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                
                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);
                
                positions.push(x, y, z);
                
                // 存储原始球体位置
                originalPositions.push({x, y, z}); 
                particleInitialPositions.push({x, y, z}); // 初始位置用于第一个插值目标
                
                colorObj.setHSL(0.6, 0.8, 0.5); 
                colors.push(colorObj.r, colorObj.g, colorObj.b);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            particles = new THREE.Points(geometry, particleMaterial);
            scene.add(particles);

            // 窗口事件
            window.addEventListener('resize', onWindowResize, false);
            // 默认先设置为球形目标
            currentTargetPoints = originalPositions;
        }

        // 创建粒子贴图 (光点)
        function getSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(240,240,255,0.6)'); 
            gradient.addColorStop(0.6, 'rgba(240,240,255,0.1)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 64, 64);
            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // -----------------------------------------------------------
        // 核心动画循环
        // -----------------------------------------------------------
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // 1. 旋转和惯性
            finalRotationY += (targetRotationY - finalRotationY) * 0.05;
            particles.rotation.y = finalRotationY;
            
            // 2. 颜色插值
            currentColor.r += (targetColor.r - currentColor.r) * LERP_SPEED;
            currentColor.g += (targetColor.g - currentColor.g) * LERP_SPEED;
            currentColor.b += (targetColor.b - currentColor.b) * LERP_SPEED;

            // 3. 粒子形态插值
            if (particles && currentTargetPoints.length === PARTICLE_COUNT) {
                const positions = particles.geometry.attributes.position.array;
                const colors = particles.geometry.attributes.color.array;

                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const idx = i * 3;
                    const target = currentTargetPoints[i];
                    const initial = particleInitialPositions[i];
                    
                    // a. 位置插值 (Lerp)
                    positions[idx] += (target.x - positions[idx]) * LERP_SPEED;
                    positions[idx + 1] += (target.y - positions[idx + 1]) * LERP_SPEED;
                    positions[idx + 2] += (target.z - positions[idx + 2]) * LERP_SPEED;

                    // b. 增加微小的躁动/波纹效果 (让粒子看起来更'活泼'，更酷炫)
                    const noise = Math.sin(time * 5 + i * 0.1) * 8;
                    positions[idx + 1] += noise * 0.01;
                    positions[idx + 2] += noise * 0.01;
                    
                    // c. 颜色更新
                    const brightnessVar = (Math.sin(i * 0.1 + time * 5) + 1) * 0.05; 
                    colors[idx] = Math.min(1, currentColor.r + brightnessVar);
                    colors[idx + 1] = Math.min(1, currentColor.g + brightnessVar);
                    colors[idx + 2] = Math.min(1, currentColor.b + brightnessVar);
                    
                    // d. 更新粒子的初始位置为当前位置，用于下一帧的插值起点
                    initial.x = positions[idx];
                    initial.y = positions[idx + 1];
                    initial.z = positions[idx + 2];
                }

                particles.geometry.attributes.position.needsUpdate = true;
                particles.geometry.attributes.color.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }


        // -----------------------------------------------------------
        // 3. MediaPipe Hands 逻辑 (使用 V5.0 的手动帧循环)
        // -----------------------------------------------------------
        function initMediaPipe() {
            // 2. 初始化 MediaPipe Hands
            hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1, 
                minDetectionConfidence: 0.7, // 提高信心度
                minTrackingConfidence: 0.7
            });

            hands.onResults(onResults);
            
            // 3. 启动摄像头
            setupCamera().then(() => {
                loadingElement.style.display = 'none';
                sendToMediaPipe(); // 启动 MediaPipe 帧循环
            }).catch(error => {
                const errorMessage = `❌ 摄像头启动失败 (${error.name})。`;
                loadingElement.innerHTML = `<span class="error-message">${errorMessage}</span><br>请检查权限。`;
                console.error("Camera setup failed:", error);
            });
        }
        
        async function setupCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                return Promise.reject(new Error("浏览器不支持摄像头访问。"));
            }

            const stream = await navigator.mediaDevices.getUserMedia({
                'video': {
                    facingMode: 'user'
                },
            });
            videoElement.srcObject = stream;
            
            return new Promise((resolve) => {
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    
                    canvasElement.width = videoElement.videoWidth;
                    canvasElement.height = videoElement.videoHeight;
                    
                    resolve();
                };
            });
        }

        async function sendToMediaPipe() {
            if (videoElement.paused || videoElement.ended) return;

            if (videoElement.readyState >= 2) {
                await hands.send({image: videoElement}); 
            }
            
            requestAnimationFrame(sendToMediaPipe);
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            let fingerCount = 0;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // 绘制骨骼
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(0, 255, 255, 0.5)', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF00FF', lineWidth: 1});

                fingerCount = countFingers(landmarks);
                updateStateByFingerCount(fingerCount);
            } else {
                // 没有手势时回到默认球体
                updateStateByFingerCount(0);
            }
            canvasCtx.restore();
        }
        
        /**
         * 统计向上伸出的手指数量 (简化版)
         */
        function countFingers(landmarks) {
            let count = 0;
            // 拇指 (4) 
            // 复杂，简化为远离手掌中心
            const thumb_is_up = landmarks[4].x < landmarks[3].x; // 假设左手
            
            // 食指 (8) - 指尖比 PIP 关节 (6) 高 (y值更小)
            if (landmarks[8].y < landmarks[6].y) count++; 
            // 中指 (12)
            if (landmarks[12].y < landmarks[10].y) count++; 
            // 无名指 (16)
            if (landmarks[16].y < landmarks[14].y) count++; 
            // 小指 (20)
            if (landmarks[20].y < landmarks[18].y) count++; 

            // 如果手掌面向摄像头 (wrist y < knuckles y), 拇指通常也算
            if (landmarks[4].y < landmarks[2].y) {
                // 仅在其他手指收起时才考虑拇指
                if (count === 0 && thumb_is_up) {
                    // count++; // 保持简单，只算 4 指
                }
            }
            
            return count;
        }

        /**
         * 根据手指数量切换粒子目标形态
         */
        function updateStateByFingerCount(count) {
            let shapeName = 'Sphere';
            let color = { r: 0.2, g: 0.8, b: 1.0 };
            let display = "等待手势...";

            if (count === 1) {
                shapeName = '陆';
                color = { r: 0.1, g: 0.5, b: 1.0 }; // 蓝色
                display = "陆之形 · 聚能";
            } 
            else if (count === 2) {
                shapeName = '知';
                color = { r: 0.7, g: 0.0, b: 1.0 }; // 紫色
                display = "知之形 · 智慧";
            } 
            else if (count === 3) {
                shapeName = '舟';
                color = { r: 1.0, g: 0.1, b: 0.1 }; // 红色
                display = "舟之形 · 航行";
            } 
            else if (count >= 4) { // 张开手掌 (4指或5指)
                shapeName = '生日快乐';
                color = { r: 1.0, g: 0.9, b: 0.0 }; // 金色
                display = "🎉 生日快乐! 🎂";
            }

            document.getElementById('current-mode').innerText = display;
            targetColor = color;
            targetRotationY += 0.005; // 保持旋转

            // 切换目标形态
            if (shapeName === 'Sphere') {
                currentTargetPoints = originalPositions;
            } else {
                // 仅在目标形态改变时才重新生成点集
                if (currentTargetPoints.length === 0 || currentTargetPoints[0].shapeName !== shapeName) {
                     currentTargetPoints = generateShapePoints(shapeName);
                     // 标记形状名称，防止重复生成
                     currentTargetPoints.forEach(p => p.shapeName = shapeName);
                }
            }
        }


        // 页面加载完成后，先启动 Three.js，再启动 MediaPipe
        window.onload = function() {
            initThreeJS();
            animate(); 
            initMediaPipe();
        };
    </script>
</body>
</html>
