<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2D 手势文字控制器 V1.0</title>
    <!-- 引入 MediaPipe 库 (用于手势识别) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Inter', sans-serif;
            color: white;
            /* 确保页面中央有足够的对比度来显示文字 */
        }

        /* ---------------- 2D 辉光文字 BILLBOARD (核心显示区域) ---------------- */
        #text-billboard {
            position: absolute;
            top: 50%;
            left: 50%;
            /* 缩小文字大小至 12vw */
            font-size: 12vw; 
            font-weight: 900;
            line-height: 1;
            white-space: nowrap;
            text-align: center;
            
            /* 居中并动画 */
            transform: translate(-50%, -50%) scale(0.8);
            pointer-events: none;
            opacity: 0; 
            transition: opacity 0.3s ease-in-out, transform 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .text-visible {
            opacity: 1 !important;
            transform: translate(-50%, -50%) scale(1);
        }

        /* ---------------- UI 元素 ---------------- */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: auto;
            text-align: left;
            pointer-events: none; 
            z-index: 10;
        }
        h1 {
            font-size: 2.2rem;
            margin: 0;
            background: linear-gradient(90deg, #00FFFF, #FF00FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0,255,255,0.5);
        }
        .mode-display {
            font-size: 1.5rem; /* 稍微缩小 */
            font-weight: bold;
            margin-top: 15px;
            text-shadow: 0 0 8px rgba(255,255,255,0.9);
            transition: color 0.3s, text-shadow 0.3s;
        }
        .instruction-list {
            margin-top: 25px;
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #00FFFF;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            pointer-events: auto; /* 允许用户选择复制 */
        }
        .instruction-item {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        .key {
            font-weight: bold;
            color: #FFD700;
            margin-right: 12px;
            width: 40px;
            font-size: 1.2rem;
        }

        /* ---------------- 摄像头预览窗口 ---------------- */
        #camera-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 180px; 
            height: 135px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid rgba(0, 255, 255, 0.4);
            z-index: 20;
            background: #000;
            transform: scaleX(-1); 
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        #input_video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block; 
            position: absolute;
            opacity: 0.3; 
        }
        #output_canvas {
            width: 100%;
            height: 100%;
            display: block;
            position: relative;
        }

        /* 加载和调试状态 */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: #00FFFF;
            text-shadow: 0 0 15px #00FFFF;
            z-index: 100;
            display: block;
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border-radius: 15px;
            max-width: 80%;
            text-align: center;
            border: 2px solid #FF00FF;
        }
    </style>
</head>
<body>

    <div id="loading">
        ⚡️ 正在启动 2D 文字手势控制器... 
        <br>
        <small>（初始化摄像头中...）</small>
    </div>
    
    <!-- 核心：居中显示、带特效的 2D 文字 -->
    <div id="text-billboard">请伸出手</div>

    <div id="ui-container">
        <h1>手势文字魔法 V1.0</h1>
        <div id="current-mode" class="mode-display" style="color:#00FFFF;">初始化摄像头...</div>
        
        <div class="instruction-list">
            <div class="instruction-item"><span class="key">☝️</span> 1指 -> 陆</div>
            <div class="instruction-item"><span class="key">✌️</span> 2指 -> 知</div>
            <div class="instruction-item"><span class="key">🤟</span> 3指 -> 舟</div>
            <div class="instruction-item"><span class="key">🖐️</span> 4+指 -> 快乐</div>
            <div class="instruction-item"><span class="key">握拳</span> -> 隐藏</div>
        </div>
    </div>

    <!-- 摄像头预览区域 -->
    <div id="camera-container">
        <video id="input_video" playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script>
        // --- 颜色配置 ---
        const TEXT_COLOR_MAP = {
            '陆': { r: 0.1, g: 0.4, b: 0.9, hex: '#4169e1' }, // RoyalBlue
            '知': { r: 0.9, g: 0.1, b: 0.9, hex: '#ff00ff' }, // Magenta
            '舟': { r: 1.0, g: 0.0, b: 0.0, hex: '#ff4500' }, // OrangeRed
            '快乐': { r: 1.0, g: 0.8, b: 0.1, hex: '#ffd700' }, // Gold
            'Wait': { r: 0.1, g: 0.9, b: 0.9, hex: '#0ff' } // 默认/等待颜色
        };
        
        // --- DOM 元素 ---
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingElement = document.getElementById('loading');
        const billboardElement = document.getElementById('text-billboard');
        const modeDisplayElement = document.getElementById('current-mode');
        let hands;

        // -----------------------------------------------------------
        // 1. MediaPipe Hands 初始化与核心逻辑
        // -----------------------------------------------------------
        function initMediaPipe() {
            hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1, 
                minDetectionConfidence: 0.7, 
                minTrackingConfidence: 0.7
            });

            hands.onResults(onResults);
            
            setupCamera().then(() => {
                loadingElement.style.display = 'none';
                // 成功启动后，明确更新状态
                modeDisplayElement.innerText = "✅ 摄像头已就绪，请伸出手掌";
                modeDisplayElement.style.color = "#00FF00";
                sendToMediaPipe(); 
            }).catch(error => {
                // 摄像头启动失败时，显示详细错误信息
                const errorMessage = `❌ 摄像头启动失败 (${error.name || '未知错误'})。`;
                loadingElement.innerHTML = `<span style="color: #FF4500; font-size: 1.8rem;">${errorMessage}</span>
                    <ul style="list-style: none; padding: 15px; margin-top: 15px; text-align: left; background: rgba(255, 69, 0, 0.1); border-radius: 8px;">
                        <li>1. 请检查您的浏览器是否**允许了摄像头权限**。</li>
                        <li>2. 摄像头是否被**其他程序**占用。</li>
                        <li>3. 尝试**刷新页面**再试一次。</li>
                    </ul>`;
                loadingElement.style.display = 'block';
                modeDisplayElement.innerText = "❌ 摄像头故障";
                modeDisplayElement.style.color = "#FF4500";
                console.error("Camera setup failed:", error);
            });
        }
        
        async function setupCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                return Promise.reject(new Error("浏览器不支持摄像头访问。"));
            }

            const stream = await navigator.mediaDevices.getUserMedia({
                'video': { facingMode: 'user' },
            });
            videoElement.srcObject = stream;
            
            return new Promise((resolve) => {
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    // 确保 canvas 尺寸匹配视频流
                    canvasElement.width = videoElement.videoWidth;
                    canvasElement.height = videoElement.videoHeight;
                    resolve();
                };
            });
        }

        async function sendToMediaPipe() {
            if (videoElement.paused || videoElement.ended) return;
            if (videoElement.readyState >= 2) {
                await hands.send({image: videoElement}); 
            }
            requestAnimationFrame(sendToMediaPipe);
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            let fingerCount = 0;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // 绘制骨骼到预览 Canvas 上
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(0, 255, 255, 0.7)', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF00FF', lineWidth: 1});

                fingerCount = countFingers(landmarks);
                updateStateByFingerCount(fingerCount);
            } else {
                updateStateByFingerCount(0); // 没有检测到手时
            }
            canvasCtx.restore();
        }
        
        /**
         * 统计向上伸出的手指数量 
         */
        function countFingers(landmarks) {
            let count = 0;
            // 简单判定：指尖 y 坐标小于指节 y 坐标 (y 轴向下增大)
            if (landmarks[8].y < landmarks[6].y) count++; // 食指
            if (landmarks[12].y < landmarks[10].y) count++; // 中指
            if (landmarks[16].y < landmarks[14].y) count++; // 无名指
            if (landmarks[20].y < landmarks[18].y) count++; // 小指
            
            // 额外检查：如果拇指尖 (4) 比手腕基部 (0) 更靠近顶部 (y 值更小)，算作伸出
            if (landmarks[4].y < landmarks[0].y - (landmarks[0].y - landmarks[9].y) * 0.5) count++; // 拇指

            return count;
        }

        /**
         * 根据手指数量切换 2D 文字内容
         */
        function updateStateByFingerCount(count) {
            let textContent = '';
            let displayMode = '等待手势...';
            let targetColor = TEXT_COLOR_MAP.Wait;

            if (count === 1) {
                textContent = '陆';
                displayMode = "☝️ 陆之形";
                targetColor = TEXT_COLOR_MAP.陆;
            } 
            else if (count === 2) {
                textContent = '知';
                displayMode = "✌️ 知之形";
                targetColor = TEXT_COLOR_MAP.知;
            } 
            else if (count === 3) {
                textContent = '舟';
                displayMode = "🤟 舟之形";
                targetColor = TEXT_COLOR_MAP.舟;
            } 
            else if (count >= 4) { // 张开手掌 (4指或5指)
                textContent = '快乐';
                displayMode = "🖐️ 快乐";
                targetColor = TEXT_COLOR_MAP.快乐;
            } 
            else {
                // count === 0
                // 如果当前模式显示的是成功启动信息，则不覆盖
                if (modeDisplayElement.innerText.includes("✅")) {
                    displayMode = "✅ 摄像头已就绪，请伸出手掌";
                }
            }


            // 1. 更新 UI 文本 (仅在非故障状态下更新)
            if (!modeDisplayElement.innerText.includes("❌")) {
                modeDisplayElement.innerText = displayMode;
            }

            // 2. 控制 2D 辉光文字显示
            if (textContent) {
                billboardElement.innerText = textContent;
                billboardElement.classList.add('text-visible');
                
                // 设置颜色和辉光特效 
                const hex = targetColor.hex;
                billboardElement.style.color = hex;
                billboardElement.style.textShadow = `
                    0 0 10px ${hex}, 
                    0 0 20px ${hex}88, 
                    0 0 40px ${hex}44, 
                    0 0 80px ${hex}22`;

            } else {
                // 握拳或无手势时，隐藏文字
                billboardElement.classList.remove('text-visible');
            }
        }


        // 页面加载完成后，启动 MediaPipe
        window.onload = function() {
            initMediaPipe();
        };
    </script>
</body>
</html>
