<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 粒子魔法手势控制</title>
    <!-- 引入 MediaPipe 样式和库 -->
    <!-- 注意：Camera 类来自 @mediapipe/camera_utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        canvas {
            display: block;
        }
        /* --- 粒子 Canvas 修复 (V4.1 核心改动) --- */
        /* 确保 Three.js 渲染的 Canvas 填满整个屏幕并位于底层 */
        body > canvas:not(#output_canvas) {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 5; /* 确保它在 UI (z-index 10, 20) 之下，但可见 */
        }
        /* ---------------- UI 元素 ---------------- */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: auto;
            text-align: left;
            pointer-events: none; /* 允许点击穿透到 Canvas */
            z-index: 10;
        }
        h1 {
            font-size: 1.8rem;
            margin: 0;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .mode-display {
            font-size: 2.5rem;
            font-weight: bold;
            margin-top: 10px;
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
            transition: color 0.3s;
        }
        .instruction-list {
            margin-top: 15px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
            border-left: 3px solid cyan;
        }
        .instruction-item {
            margin-bottom: 5px;
            display: flex;
            align-items: center;
        }
        .key {
            font-weight: bold;
            color: #fff;
            margin-right: 8px;
            width: 30px;
        }
        /* ---------------- 摄像头预览窗口 ---------------- */
        #camera-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 240px; /* 固定的预览尺寸 */
            height: 180px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            z-index: 20;
            background: #000;
            transform: scaleX(-1); /* 翻转预览 */
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        /* 视频元素用于 MediaPipe 读取帧，保持隐藏 */
        #input_video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block; 
            position: absolute;
            opacity: 0; 
        }
        /* Canvas 用于绘制手势骨骼 */
        #output_canvas {
            width: 100%;
            height: 100%;
            display: block;
            position: relative;
        }
        /* 加载和调试状态 */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: cyan;
            text-shadow: 0 0 10px cyan;
            z-index: 100;
            display: block;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            max-width: 80%;
            text-align: center;
        }
        .error-message {
            color: #FF4500;
            text-shadow: 0 0 10px #FF4500;
        }
    </style>
</head>
<body>

    <div id="loading">
        ✨ 正在启动魔法引擎... 
        <br>
        <small>（使用 MediaPipe Camera Utility 启动中...）</small>
    </div>

    <div id="ui-container">
        <h1>粒子力场 V4.1</h1>
        <div id="current-mode" class="mode-display">等待手势...</div>
        
        <div class="instruction-list">
            <div class="instruction-item"><span class="key">☝️</span> 1指 · 聚能核心 (金色)</div>
            <div class="instruction-item"><span class="key">✌️</span> 2指 · 膨胀爆发 (红色)</div>
            <div class="instruction-item"><span class="key">🤟</span> 3指 · 时空波浪 (紫色)</div>
            <div class="instruction-item"><span class="key">👌</span> 捏合 · 旋转控制 (拖拽)</div>
        </div>
    </div>

    <!-- 摄像头预览区域 -->
    <div id="camera-container">
        <!-- 视频元素：保留移动端兼容性配置 -->
        <video id="input_video" playsinline muted></video>
        <!-- Canvas 元素用于绘制手势骨骼 -->
        <canvas id="output_canvas"></canvas>
    </div>

    <!-- Three.js 渲染器将自动添加到 body -->

    <script>
        // --- Three.js 变量 ---
        let scene, camera, renderer;
        let particles;
        let originalPositions = []; 
        let targetRotationX = 0;
        let targetRotationY = 0;
        let targetRotationOnMouseDownY = 0;
        let targetRotationOnMouseDownX = 0;
        let mouseX = 0;
        let mouseY = 0;
        let mouseXOnMouseDown = 0;
        let mouseYOnMouseDown = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;
        
        // 状态变量
        let isDragging = false;
        let isPinching = false;
        let finalRotationY = 0;
        let finalRotationX = 0;
        let time = 0;

        // 颜色目标 (RGB)
        let currentColor = { r: 0.2, g: 0.8, b: 1.0 }; 
        let targetColor = { r: 0.2, g: 0.8, b: 1.0 };
        
        // 粒子形态参数
        let expansionFactor = 1.0;
        let targetExpansion = 1.0;
        let waveIntensity = 0;
        let targetWave = 0;
        let rotationSpeed = 0.001;
        let targetRotationSpeed = 0.001;

        // -----------------------------------------------------------
        // Three.js 初始化与逻辑
        // -----------------------------------------------------------
        function initThreeJS() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.001); 

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 3000);
            camera.position.z = 1000;

            // 关键：renderer 需要设置 alpha: true 才能透出背景色，但我们设置为 false 确保背景是黑的
            // 为了防止 Three.js Canvas 被其他元素覆盖，我们主要依赖 CSS z-index 解决
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false }); 
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 材质
            const particleMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 12,
                map: getSprite(),
                blending: THREE.AdditiveBlending,
                depthTest: false,
                transparent: true,
                opacity: 0.9,
                vertexColors: true
            });

            const geometry = new THREE.BufferGeometry();
            const particleCount = 2500;
            const positions = [];
            const colors = [];
            const colorObj = new THREE.Color();

            // 生成球形粒子
            for (let i = 0; i < particleCount; i++) {
                const radius = 600 + Math.random() * 50;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                
                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);
                
                positions.push(x, y, z);
                
                originalPositions.push({x, y, z, radius, theta, phi}); // 存储原始位置用于变形
                
                colorObj.setHSL(0.6, 0.8, 0.5); 
                colors.push(colorObj.r, colorObj.g, colorObj.b);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            particles = new THREE.Points(geometry, particleMaterial);
            scene.add(particles);

            // 鼠标和窗口事件
            document.addEventListener('mousedown', onDocumentMouseDown, false);
            document.addEventListener('touchstart', onDocumentTouchStart, false);
            window.addEventListener('resize', onWindowResize, false);
        }

        // 创建粒子贴图
        function getSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(240,240,255,0.6)'); 
            gradient.addColorStop(0.5, 'rgba(240,240,255,0.1)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 32, 32);
            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        function onWindowResize() {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 鼠标拖拽逻辑
        function onDocumentMouseDown(event) {
            if(isPinching) return; 
            event.preventDefault();
            isDragging = true;
            document.addEventListener('mousemove', onDocumentMouseMove, false);
            document.addEventListener('mouseup', onDocumentMouseUp, false);
            mouseXOnMouseDown = event.clientX - windowHalfX;
            mouseYOnMouseDown = event.clientY - windowHalfY;
            targetRotationOnMouseDownY = targetRotationY;
            targetRotationOnMouseDownX = targetRotationX;
        }
        function onDocumentMouseMove(event) {
            mouseX = event.clientX - windowHalfX;
            mouseY = event.clientY - windowHalfY;
            targetRotationY = targetRotationOnMouseDownY + (mouseX - mouseXOnMouseDown) * 0.005;
            targetRotationX = targetRotationOnMouseDownX + (mouseY - mouseYOnMouseDown) * 0.005;
        }
        function onDocumentMouseUp() {
            isDragging = false;
            document.removeEventListener('mousemove', onDocumentMouseMove);
            document.removeEventListener('mouseup', onDocumentMouseUp);
        }

        // 触摸屏拖拽兼容
        function onDocumentTouchStart(event) {
            if (isPinching || event.touches.length !== 1) return;
            event.preventDefault();
            isDragging = true;
            document.addEventListener('touchmove', onDocumentTouchMove, false);
            document.addEventListener('touchend', onDocumentTouchEnd, false);
            mouseXOnMouseDown = event.touches[0].clientX - windowHalfX;
            mouseYOnMouseDown = event.touches[0].clientY - windowHalfY;
            targetRotationOnMouseDownY = targetRotationY;
            targetRotationOnMouseDownX = targetRotationX;
        }
        function onDocumentTouchMove(event) {
            if (isPinching || event.touches.length !== 1) return;
            mouseX = event.touches[0].clientX - windowHalfX;
            mouseY = event.touches[0].clientY - windowHalfY;
            targetRotationY = targetRotationOnMouseDownY + (mouseX - mouseXOnMouseDown) * 0.008;
            targetRotationX = targetRotationOnMouseDownX + (mouseY - mouseYOnMouseDown) * 0.008;
        }
        function onDocumentTouchEnd() {
            isDragging = false;
            document.removeEventListener('touchmove', onDocumentTouchMove);
            document.removeEventListener('touchend', onDocumentTouchEnd);
        }

        // -----------------------------------------------------------
        // 核心动画循环
        // -----------------------------------------------------------
        function animate() {
            requestAnimationFrame(animate);
            time += 0.02;

            // 1. 插值过渡动画 
            currentColor.r += (targetColor.r - currentColor.r) * 0.05;
            currentColor.g += (targetColor.g - currentColor.g) * 0.05;
            currentColor.b += (targetColor.b - currentColor.b) * 0.05;

            // 形态参数平滑过渡
            expansionFactor += (targetExpansion - expansionFactor) * 0.05;
            waveIntensity += (targetWave - waveIntensity) * 0.05;
            rotationSpeed += (targetRotationSpeed - rotationSpeed) * 0.05;

            // 旋转惯性
            finalRotationY += (targetRotationY - finalRotationY) * 0.05;
            finalRotationX += (targetRotationX - finalRotationX) * 0.05;

            // 2. 更新粒子位置和颜色
            if (particles) {
                // 自动旋转
                if (!isDragging && !isPinching) {
                     targetRotationY += rotationSpeed; 
                }
                
                particles.rotation.y = finalRotationY;
                particles.rotation.x = finalRotationX;

                const positions = particles.geometry.attributes.position.array;
                const colors = particles.geometry.attributes.color.array;

                for (let i = 0; i < originalPositions.length; i++) {
                    const orig = originalPositions[i];
                    const idx = i * 3;

                    // --- 动态变形逻辑 ---
                    
                    // 基础半径 + 膨胀系数
                    let r = orig.radius * expansionFactor;
                    
                    // 波浪效果 
                    let waveY = 0;

                    if (waveIntensity > 0.01) {
                         const wave = Math.sin(orig.y * 0.01 + time * 2) * 100 * waveIntensity;
                         r += wave; 
                         waveY = wave; 
                    }

                    // 重新计算坐标 (球坐标 -> 直角坐标)
                    let newX = r * Math.sin(orig.phi) * Math.cos(orig.theta);
                    let newY = r * Math.sin(orig.phi) * Math.sin(orig.theta) + waveY;
                    let newZ = r * Math.cos(orig.phi);

                    // 赋值位置
                    positions[idx] = newX;
                    positions[idx + 1] = newY;
                    positions[idx + 2] = newZ;

                    // --- 动态颜色逻辑 ---
                    const brightnessVar = (Math.sin(i + time) + 1) * 0.1; 
                    
                    colors[idx] = Math.min(1, currentColor.r + brightnessVar);
                    colors[idx + 1] = Math.min(1, currentColor.g + brightnessVar);
                    colors[idx + 2] = Math.min(1, currentColor.b + brightnessVar);
                }

                particles.geometry.attributes.position.needsUpdate = true;
                particles.geometry.attributes.color.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }
        
        // -----------------------------------------------------------
        // MediaPipe Hands 逻辑 - 使用 Camera 实用工具
        // -----------------------------------------------------------
        function initMediaPipe() {
            const videoElement = document.getElementById('input_video');
            const canvasElement = document.getElementById('output_canvas');
            const canvasCtx = canvasElement.getContext('2d');
            const loadingElement = document.getElementById('loading');
            
            // 1. 初始化 Three.js 和动画
            initThreeJS();
            animate(); // 启动 Three.js 动画

            // 2. 初始化 MediaPipe Hands
            const hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1, 
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            hands.onResults(onResults);
            
            // 3. 使用 MediaPipe Camera 启动摄像头和帧循环 
            const camera = new Camera(videoElement, {
                // 启动摄像头后，每一帧都会执行 onFrame
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 640,
                height: 480,
                facingMode: 'user' // 使用前置摄像头
            });

            // 监听 Camera 启动完成事件
            camera.getVideo().addEventListener('loadeddata', () => {
                loadingElement.style.display = 'none';
                console.log("Camera and Frame Loop started successfully using MediaPipe Camera utility.");
                // 强制设置 Canvas 内部尺寸与视频流尺寸一致
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
            });

            camera.start().catch(error => {
                const errorMessage = `❌ 摄像头启动失败 (${error.name})。`;
                loadingElement.innerHTML = `<span class="error-message">${errorMessage}</span><br>错误原因：${error.message || '未知错误'}。<br>请检查权限或是否被占用。`;
                console.error("Camera startup failed:", error);
            });
            
            // 4. MediaPipe 结果处理 
            function onResults(results) {
                // 绘制骨骼到预览 Canvas
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                
                // 绘制手势骨骼
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FFFF', lineWidth: 2});
                    drawLandmarks(canvasCtx, landmarks, {color: '#FF00FF', lineWidth: 1});

                    // 1. 检测捏合 (Pinch) - 优先级最高
                    const indexTip = landmarks[8];
                    const thumbTip = landmarks[4];
                    const middleMCP = landmarks[9];
                    
                    const pinchDist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
                    // 将归一化坐标转换为屏幕坐标，用于拖拽计算
                    const currentHandX = (1 - middleMCP.x) * window.innerWidth;
                    const currentHandY = middleMCP.y * window.innerHeight;

                    if (pinchDist < 0.05) {
                        handlePinchMode(currentHandX, currentHandY);
                    } else {
                        isPinching = false;
                        const count = countFingers(landmarks);
                        updateStateByFingerCount(count);
                    }
                } else {
                    // 没检测到手 - 恢复默认
                    resetToIdle();
                }
                canvasCtx.restore();
            }
            
            function countFingers(landmarks) {
                let count = 0;
                // 简单判定：指尖 y 坐标小于关节 y 坐标 (屏幕坐标系 y 向下增大)
                if (landmarks[8].y < landmarks[6].y) count++; // 食指
                if (landmarks[12].y < landmarks[10].y) count++; // 中指
                if (landmarks[16].y < landmarks[14].y) count++; // 无名指
                if (landmarks[20].y < landmarks[18].y) count++; // 小指
                // 拇指通常需要更复杂的逻辑，这里简化为 4 指
                
                return count;
            }

            function handlePinchMode(x, y) {
                if (!isPinching) {
                    isPinching = true;
                    // 初始化拖拽起始点为手势中心点
                    mouseXOnMouseDown = x - windowHalfX;
                    mouseYOnMouseDown = y - windowHalfY;
                    targetRotationOnMouseDownY = targetRotationY;
                    targetRotationOnMouseDownX = targetRotationX;
                    
                    document.getElementById('current-mode').innerText = "🌀 捏合旋转中";
                    document.getElementById('current-mode').style.color = "#00FFFF";
                } else {
                    const dx = x - windowHalfX;
                    const dy = y - windowHalfY;
                    // 使用手势中心点的位移来更新目标旋转角度
                    targetRotationY = targetRotationOnMouseDownY + (dx - mouseXOnMouseDown) * 0.008;
                    targetRotationX = targetRotationOnMouseDownX + (dy - mouseYOnMouseDown) * 0.008;
                }
                setTargetParams(1.0, 0, 0.0, {r: 0.5, g: 0.9, b: 0.9}); 
            }

            function updateStateByFingerCount(count) {
                if (count === 0 || count > 3) {
                    resetToIdle();
                    return;
                }

                if (count === 1) {
                    document.getElementById('current-mode').innerText = "☝️ 聚能模式";
                    document.getElementById('current-mode').style.color = "#FFD700"; 
                    setTargetParams(0.6, 0, 0.02, {r: 1.0, g: 0.8, b: 0.1});
                } 
                else if (count === 2) {
                    document.getElementById('current-mode').innerText = "✌️ 爆发模式";
                    document.getElementById('current-mode').style.color = "#FF3333"; 
                    setTargetParams(1.4, 0, 0.005, {r: 1.0, g: 0.2, b: 0.2});
                } 
                else if (count === 3) {
                    document.getElementById('current-mode').innerText = "🤟 时空波浪";
                    document.getElementById('current-mode').style.color = "#BF00FF"; 
                    setTargetParams(1.1, 1.0, 0.002, {r: 0.7, g: 0.0, b: 1.0});
                }
            }

            function resetToIdle() {
                document.getElementById('current-mode').innerText = "等待手势...";
                document.getElementById('current-mode').style.color = "#FFFFFF";
                isPinching = false;
                setTargetParams(1.0, 0, 0.001, {r: 0.2, g: 0.8, b: 1.0});
            }

            function setTargetParams(exp, wave, rotSpeed, col) {
                targetExpansion = exp;
                targetWave = wave;
                targetRotationSpeed = rotSpeed;
                targetColor = col;
            }
        }

        // 页面加载完成后启动 MediaPipe
        window.onload = initMediaPipe;
    </script>
</body>
</html>
