<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Particle Rotation with Hand Gestures</title>
    <!-- 引入 MediaPipe 样式和库 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        canvas {
            display: block;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            font-weight: 300;
            letter-spacing: 2px;
        }
        .instruction {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            backdrop-filter: blur(5px);
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: background 0.3s;
        }
        .instruction.active {
            background: rgba(0, 255, 255, 0.3);
            border-color: rgba(0, 255, 255, 0.6);
            color: #fff;
            font-weight: bold;
        }
        /* 摄像头预览窗口 */
        #camera-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            z-index: 20;
            background: #000;
            transform: scaleX(-1); /* 镜像显示，让操作更自然 */
        }
        #input_video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* 隐藏原始视频，只显示画了骨骼的 canvas */
        }
        #output_canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: cyan;
            text-shadow: 0 0 10px cyan;
            z-index: 100;
            display: block;
        }
        /* 手势状态指示器 */
        #gesture-status {
            position: absolute;
            bottom: 180px;
            right: 20px;
            text-align: right;
            font-size: 0.9rem;
            color: #aaa;
            pointer-events: none;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #555;
            margin-right: 5px;
        }
        .status-dot.active {
            background: #0f0;
            box-shadow: 0 0 5px #0f0;
        }
    </style>
</head>
<body>

    <div id="loading">正在启动摄像头与AI模型...</div>

    <div id="ui-container">
        <h1>粒子力场控制器</h1>
        <div class="instruction" id="instruction-box">
            <span>👌 食指拇指捏合</span> = 抓住并旋转
        </div>
    </div>

    <div id="gesture-status">
        <span class="status-dot" id="hand-detected-dot"></span> 检测到手部<br>
        <span class="status-dot" id="pinch-detected-dot"></span> 捏合锁定
    </div>

    <!-- 摄像头预览区域 -->
    <div id="camera-container">
        <video id="input_video"></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Three.js 变量 ---
        let scene, camera, renderer;
        let particles;
        let targetRotationX = 0;
        let targetRotationY = 0;
        let targetRotationOnMouseDownX = 0;
        let targetRotationOnMouseDownY = 0;
        let mouseX = 0;
        let mouseY = 0;
        let mouseXOnMouseDown = 0;
        let mouseYOnMouseDown = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;
        
        let isDragging = false;
        let finalRotationY = 0;
        let finalRotationX = 0;
        let hue = 0;

        // --- 手势控制变量 ---
        let isPinching = false;
        let previousPinchX = 0;
        let previousPinchY = 0;

        initThreeJS();
        animate();
        initMediaPipe();

        // -----------------------------------------------------------
        // Three.js 初始化与逻辑 (保持原有大部分逻辑)
        // -----------------------------------------------------------
        function initThreeJS() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.002);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 3000);
            camera.position.z = 1000;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const particleMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 15,
                map: getSprite(),
                blending: THREE.AdditiveBlending,
                depthTest: false,
                transparent: true,
                opacity: 0.8,
                vertexColors: true
            });

            const geometry = new THREE.BufferGeometry();
            const particleCount = 2000;
            const positions = [];
            const colors = [];
            const colorObj = new THREE.Color();

            for (let i = 0; i < particleCount; i++) {
                const radius = 600 + Math.random() * 50;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);
                positions.push(x, y, z);
                colorObj.setHSL(0.5 + Math.random() * 0.2, 0.8, 0.5);
                colors.push(colorObj.r, colorObj.g, colorObj.b);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            particles = new THREE.Points(geometry, particleMaterial);
            scene.add(particles);

            // 保留鼠标事件作为备用控制
            document.addEventListener('mousedown', onDocumentMouseDown, false);
            window.addEventListener('resize', onWindowResize, false);
        }

        function getSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.2)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 32, 32);
            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        function onWindowResize() {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 鼠标回退兼容逻辑 ---
        function onDocumentMouseDown(event) {
            // 如果已经在用手势，忽略鼠标
            if(isPinching) return; 
            
            event.preventDefault();
            isDragging = true;
            document.addEventListener('mousemove', onDocumentMouseMove, false);
            document.addEventListener('mouseup', onDocumentMouseUp, false);
            mouseXOnMouseDown = event.clientX - windowHalfX;
            mouseYOnMouseDown = event.clientY - windowHalfY;
            targetRotationOnMouseDownY = targetRotationY;
            targetRotationOnMouseDownX = targetRotationX;
        }
        function onDocumentMouseMove(event) {
            mouseX = event.clientX - windowHalfX;
            mouseY = event.clientY - windowHalfY;
            targetRotationY = targetRotationOnMouseDownY + (mouseX - mouseXOnMouseDown) * 0.005;
            targetRotationX = targetRotationOnMouseDownX + (mouseY - mouseYOnMouseDown) * 0.005;
        }
        function onDocumentMouseUp() {
            isDragging = false;
            document.removeEventListener('mousemove', onDocumentMouseMove);
            document.removeEventListener('mouseup', onDocumentMouseUp);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // 惯性逻辑
            finalRotationY += (targetRotationY - finalRotationY) * 0.05;
            finalRotationX += (targetRotationX - finalRotationX) * 0.05;

            if (particles) {
                particles.rotation.y = finalRotationY;
                particles.rotation.x = finalRotationX;

                const time = Date.now() * 0.001;
                const scale = 1 + Math.sin(time) * 0.03;
                particles.scale.set(scale, scale, scale);

                if (!isDragging && !isPinching) {
                     targetRotationY += 0.001; 
                }
                
                hue += 0.001;
                if (hue > 1) hue = 0;
            }
            renderer.render(scene, camera);
        }

        // -----------------------------------------------------------
        // MediaPipe Hands 初始化与逻辑
        // -----------------------------------------------------------
        function initMediaPipe() {
            const videoElement = document.getElementById('input_video');
            const canvasElement = document.getElementById('output_canvas');
            const canvasCtx = canvasElement.getContext('2d');
            
            // 初始化 Hands 模型
            const hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onResults);

            // 初始化摄像头
            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 320,
                height: 240
            });
            
            cameraUtils.start()
                .then(() => {
                    document.getElementById('loading').style.display = 'none';
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('loading').innerText = "无法访问摄像头，请检查权限。";
                });

            function onResults(results) {
                // 绘制摄像头预览
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
                
                const handDot = document.getElementById('hand-detected-dot');
                const pinchDot = document.getElementById('pinch-detected-dot');
                const instructionBox = document.getElementById('instruction-box');

                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    handDot.classList.add('active');
                    
                    const landmarks = results.multiHandLandmarks[0];
                    
                    // 绘制骨骼
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                    drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1});

                    // 核心逻辑：检测捏合 (食指尖 8 和 拇指尖 4)
                    const indexTip = landmarks[8];
                    const thumbTip = landmarks[4];
                    const middleMCP = landmarks[9]; // 手掌中心大概位置

                    // 计算距离 (简单的欧几里得距离)
                    const distance = Math.sqrt(
                        Math.pow(indexTip.x - thumbTip.x, 2) + 
                        Math.pow(indexTip.y - thumbTip.y, 2)
                    );

                    // 阈值判断 (根据实际测试，0.05左右比较合适，因为坐标是归一化的0-1)
                    // 注意：MediaPipe 坐标 x 是反的（镜像），这里我们先做逻辑处理
                    // 屏幕坐标映射：
                    // MediaPipe X: 0 (left) -> 1 (right)
                    // 但我们在预览里做了镜像 scaleX(-1)，所以视觉上符合
                    // 逻辑上：手向右移，landmarks[9].x 变大
                    
                    const currentHandX = (1 - middleMCP.x) * window.innerWidth; // 反转X以匹配镜像
                    const currentHandY = middleMCP.y * window.innerHeight;

                    if (distance < 0.08) {
                        // === 捏合状态 (Drag) ===
                        if (!isPinching) {
                            // 刚开始捏合：记录初始位置
                            isPinching = true;
                            pinchDot.classList.add('active');
                            instructionBox.classList.add('active');
                            instructionBox.innerHTML = "✋ 保持捏合移动以旋转";

                            mouseXOnMouseDown = currentHandX - windowHalfX;
                            mouseYOnMouseDown = currentHandY - windowHalfY;
                            targetRotationOnMouseDownY = targetRotationY;
                            targetRotationOnMouseDownX = targetRotationX;
                        } else {
                            // 保持捏合：计算旋转
                            const mouseX = currentHandX - windowHalfX;
                            const mouseY = currentHandY - windowHalfY;

                            // 灵敏度系数 0.008
                            targetRotationY = targetRotationOnMouseDownY + (mouseX - mouseXOnMouseDown) * 0.008;
                            targetRotationX = targetRotationOnMouseDownX + (mouseY - mouseYOnMouseDown) * 0.008;
                        }
                    } else {
                        // === 松开状态 (Release) ===
                        if (isPinching) {
                            isPinching = false;
                            pinchDot.classList.remove('active');
                            instructionBox.classList.remove('active');
                            instructionBox.innerHTML = "👌 食指拇指捏合 = 抓住";
                        }
                    }

                } else {
                    handDot.classList.remove('active');
                    pinchDot.classList.remove('active');
                    isPinching = false;
                }
                canvasCtx.restore();
            }
        }
    </script>
</body>
</html>
