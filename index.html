var qi=state.order[state.idx];var q=allQ[qi];
var id=qid(q);
var isFav=fav.indexOf(id)>=0;
var pct=((state.idx+1)/state.order.length*100).toFixed(0);
var h='<div class="hd"><h1>'+PAPERS[q.paper].name+'</h1><div class="s">第 '+(state.idx+1)+' / '+state.order.length+' 题</div></div>';
h+='<div class="wrap"><div class="prog"><div class="bar" style="width:'+pct+'%"></div></div>';
h+='<div class="card"><span class="qtype'+(q.t==1?' judge':'')+'">'+(q.t==0?'单选题':'判断题')+'</span>';
h+='<div class="qnum">第'+q.n+'题</div><div class="qtext">'+q.q+'</div>';
var letters=['A','B','C','D'];
q.opts.forEach(function(op,i){
h+='<div class="opt" data-i="'+i+'" onclick="pick('+i+')"><div class="tg">'+letters[i]+'</div><div class="tx">'+op+'</div></div>';
});
h+='<div class="exp" id="exp"><span class="at">正确答案：'+q.ans+'</span>　'+q.opts[letters.indexOf(q.ans)]+'</div>';
h+='</div>';
h+='<div class="fbar"><button class="fb fbp" onclick="prevQ()" '+(state.idx<=0?'disabled':'')+'>上一题</button>';
h+='<button class="fb fbf'+(isFav?' on':'')+'" onclick="toggleFav()">'+(isFav?'★ 已藏':'☆ 收藏')+'</button>';
h+='<button class="fb fbn" onclick="nextQ()">'+(state.idx>=state.order.length-1?'完成':'下一题')+'</button></div></div>';
return h;
}
function pick(i){
if(state.answered)return;
state.answered=true;
var qi=state.order[state.idx];var q=allQ[qi];
var letters=['A','B','C','D'];
var opts=document.querySelectorAll('.opt');
opts.forEach(function(o,j){o.classList.add('off');});
var chosen=letters[i];
if(chosen==q.ans){opts[i].classList.add('ok');}
else{opts[i].classList.add('no');opts[letters.indexOf(q.ans)].classList.add('ok');
var id=qid(q);if(wrong.indexOf(id)<0){wrong.push(id);save();}
}
var id=qid(q);if(done.indexOf(id)<0){done.push(id);save();}
document.getElementById('exp').classList.add('show');
}
function toggleFav(){
var qi=state.order[state.idx];var q=allQ[qi];var id=qid(q);
var i=fav.indexOf(id);if(i>=0)fav.splice(i,1);else fav.push(id);
save();render();
}
function prevQ(){if(state.idx>0){state.idx--;state.answered=false;render();}}
function nextQ(){
if(state.idx>=state.order.length-1){backHome();return;}
state.idx++;state.answered=false;render();
}
function backHome(){state.screen='home';state.answered=false;render();}
// 考试
function startExam(){
var pool=allQ.map(function(q,i){return i;});
pool.sort(function(){return Math.random()-0.5;});
state.order=pool.slice(0,100);
state.idx=0;state.examAns={};state.examStart=Date.now();state.screen='exam';
state.examTimer=setInterval(function(){render();},1000);
render();
}
function examHTML(){
var qi=state.order[state.idx];var q=allQ[qi];
var el=Math.floor((Date.now()-state.examStart)/1000);
var mm=String(Math.floor(el/60)).padStart(2,'0');var ss=String(el%60).padStart(2,'0');
var pct=((state.idx+1)/state.order.length*100).toFixed(0);
var h='<div class="hd"><h1>模拟考试</h1><div class="s">⏱ '+mm+':'+ss+'　已答 '+Object.keys(state.examAns).length+'/100</div></div>';
h+='<div class="wrap"><div class="prog"><div class="bar" style="width:'+pct+'%"></div></div>';
h+='<div class="card"><span class="qtype'+(q.t==1?' judge':'')+'">'+(q.t==0?'单选题':'判断题')+'</span>';
h+='<div class="qnum">第'+(state.idx+1)+'题</div><div class="qtext">'+q.q+'</div>';
var letters=['A','B','C','D'];
var sel=state.examAns[state.idx];
q.opts.forEach(function(op,i){
var cls='opt';
if(sel!=null&&letters[i]==sel)cls+=' ok';
h+='<div class="'+cls+'" onclick="epick('+i+')"><div class="tg">'+letters[i]+'</div><div class="tx">'+op+'</div></div>';
});
h+='</div>';
h+='<div class="fbar"><button class="fb fbp" onclick="eprev()" '+(state.idx<=0?'disabled':'')+'>上一题</button>';
h+='<button class="fb fbp" onclick="state.screen=\'board\';render();">答题卡</button>';
h+='<button class="fb fbn" onclick="enext()">'+(state.idx>=state.order.length-1?'交卷':'下一题')+'</button></div></div>';
return h;
}
function epick(i){var letters=['A','B','C','D'];state.examAns[state.idx]=letters[i];render();}
function eprev(){if(state.idx>0){state.idx--;render();}}
function enext(){
if(state.idx>=state.order.length-1){
if(Object.keys(state.examAns).length<100){if(!confirm('还有'+(100-Object.keys(state.examAns).length)+'题未答，确认交卷？'))return;}
else{if(!confirm('确认交卷？'))return;}
clearInterval(state.examTimer);
state.screen='result';render();return;
}
state.idx++;render();
}
function boardHTML(){
var h='<div class="hd"><h1>答题卡</h1></div><div class="wrap"><div class="bkb" onclick="state.screen=\'exam\';render();">← 返回答题</div><div class="exg">';
state.order.forEach(function(q,i){
var cls='eg';
if(state.examAns[i])cls+=' an';
if(i==state.idx)cls+=' cur';
h+='<div class="'+cls+'" onclick="state.idx='+i+';state.screen=\'exam\';render();">'+(i+1)+'</div>';
});
h+='</div><div style="text-align:center;margin-top:20px"><button class="fb fbn" onclick="enext()">交卷</button></div></div>';
return h;
}
function resultHTML(){
var correct=0;
state.order.forEach(function(qi,i){
var q=allQ[qi];var letters=['A','B','C','D'];
if(state.examAns[i]==q.ans)correct++;
});
var score=correct;
var pass=score>=60;
var el=Math.floor((Date.now()-state.examStart)/1000);
var mm=Math.floor(el/60),ss=el%60;
var h='<div class="hd"><h1>考试结果</h1></div><div class="wrap"><div class="card res">';
h+='<div class="sc" style="color:'+(pass?'#27ae60':'#e74c3c')+'">'+score+'分</div>';
h+='<div class="ps '+(pass?'pass-ok':'pass-no')+'">'+(pass?'🎉 恭喜通过！':'未通过，继续加油！')+'</div>';
h+='<div style="margin-top:16px;font-size:14px;color:#666">答对 '+correct+' 题 · 答错 '+(100-correct)+' 题 · 用时 '+mm+'分'+ss+'秒</div>';
h+='<div style="margin-top:20px"><button class="fb fbn" onclick="backHome()">返回首页</button></div>';
h+='</div></div>';
return h;
}
render();
</script>
</body>
</html>
