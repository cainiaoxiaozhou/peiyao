<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>摄像头调试工具</title>
    <!-- 引入 MediaPipe 库 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #camera-container {
            position: relative;
            width: 90%; 
            max-width: 640px; 
            aspect-ratio: 4 / 3;
            border-radius: 12px;
            overflow: hidden;
            border: 5px solid #00FFFF;
            background: #000;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            /* 翻转以模拟自拍模式 */
            transform: scaleX(-1); 
        }
        
        /* 视频元素用于 MediaPipe 读取帧，保持隐藏 */
        #input_video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block; 
            position: absolute;
            opacity: 0; 
        }

        /* Canvas 用于绘制视频帧和手势骨骼，它应该显示画面 */
        #output_canvas {
            width: 100%;
            height: 100%;
            display: block;
            position: relative;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: cyan;
            text-shadow: 0 0 10px cyan;
            z-index: 100;
            display: block;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            max-width: 80%;
            text-align: center;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
        .error-message {
            color: #FF4500;
            text-shadow: 0 0 10px #FF4500;
        }
        .debug-status {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 101;
            padding: 5px 15px;
            background: rgba(0,0,0,0.7);
            border-radius: 8px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div id="camera-container">
        <!-- 视频元素：playsinline muted 是移动端启动的关键 -->
        <video id="input_video" playsinline muted></video>
        <!-- Canvas 元素：用于绘制视频画面和骨骼 -->
        <canvas id="output_canvas"></canvas>
    </div>

    <div id="loading">
        🎥 正在请求摄像头权限... 
        <br>
        <small>（请允许访问，并等待视频流启动）</small>
    </div>
    
    <div id="debug-status" class="debug-status" style="display:none;">
        状态：<span id="video-state">初始化</span>
    </div>

    <script>
        // -----------------------------------------------------------
        // MediaPipe Hands 逻辑 - 纯摄像头测试
        // -----------------------------------------------------------
        function initMediaPipe() {
            const videoElement = document.getElementById('input_video');
            const canvasElement = document.getElementById('output_canvas');
            const canvasCtx = canvasElement.getContext('2d');
            const loadingElement = document.getElementById('loading');
            const statusElement = document.getElementById('video-state');
            const debugStatusContainer = document.getElementById('debug-status');

            // 1. 初始化 MediaPipe
            const hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 0, // 降低复杂度以加快加载速度
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onResults);
            
            // 2. 摄像头启动逻辑
            async function setupCamera() {
                debugStatusContainer.style.display = 'block';
                statusElement.textContent = '请求权限中...';
                try {
                    // 获取视频流，设置理想的分辨率
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            facingMode: "user", 
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        } 
                    });
                    
                    videoElement.srcObject = stream;
                    statusElement.textContent = '视频流已获取。等待元数据加载...';

                    // 视频元数据加载完成后
                    videoElement.onloadedmetadata = () => {
                        const videoWidth = videoElement.videoWidth;
                        const videoHeight = videoElement.videoHeight;
                        
                        // 强制设置 Canvas 内部尺寸与视频流尺寸一致
                        canvasElement.width = videoWidth;
                        canvasElement.height = videoHeight;
                        
                        statusElement.textContent = `视频尺寸: ${videoWidth}x${videoHeight}。尝试播放...`;
                        
                        // 关键步骤：使用 play() Promise 确保视频流在移动端启动
                        videoElement.play().then(() => {
                            loadingElement.style.display = 'none';
                            statusElement.textContent = '✅ 摄像头画面已启动！';
                            console.log("Camera stream started and video is playing.");
                            // 启动 MediaPipe 的帧处理循环
                            requestAnimationFrame(sendToMediaPipe);
                        }).catch(e => {
                            const errorMessage = `❌ 视频播放失败: ${e.message}。`;
                            loadingElement.innerHTML = `<span class="error-message">${errorMessage}</span><br>请在 URL 栏手动点击播放按钮，或尝试在屏幕上点击一次。`;
                            statusElement.textContent = '❌ 播放失败';
                            console.error("Video play failed:", e);
                        });
                    };

                } catch (error) {
                    const errorMessage = `❌ 摄像头启动失败 (${error.name})。`;
                    loadingElement.innerHTML = `<span class="error-message">${errorMessage}</span><br>错误原因：${error.message || '未知错误'}。<br>请检查权限或是否被占用。`;
                    statusElement.textContent = '❌ 启动失败';
                    console.error("Camera startup failed:", error);
                }
            }

            // 3. 自定义帧处理循环
            async function sendToMediaPipe() {
                // 确保视频已经准备好渲染（readyState >= 2 表示有帧数据）
                if (videoElement.readyState >= 2) {
                    await hands.send({image: videoElement});
                }
                // 使用 requestAnimationFrame 保证流畅性
                requestAnimationFrame(sendToMediaPipe);
            }
            
            // 启动
            setupCamera();

            // 4. MediaPipe 结果处理
            function onResults(results) {
                // 清空 Canvas
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                // ** 关键步骤：将视频帧绘制到 Canvas 上 **
                // 即使没有检测到手，也应该绘制这个图像
                if (results.image) {
                    canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
                    statusElement.textContent = '✅ 画面绘制正常 (等待手势)';
                } else {
                    statusElement.textContent = '⚠️ 无法获取 MediaPipe 图像数据';
                }

                // 绘制手势骨骼（可选，用于确认 MediaPipe 运行正常）
                if (results.multiHandLandmarks) {
                    for (const landmarks of results.multiHandLandmarks) {
                        drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FFFF', lineWidth: 2});
                        drawLandmarks(canvasCtx, landmarks, {color: '#FF00FF', lineWidth: 1});
                        statusElement.textContent = '✅ 画面绘制正常 (已检测到手势)';
                    }
                }
                canvasCtx.restore();
            }
        }

        // 页面加载完成后启动 MediaPipe
        window.onload = initMediaPipe;
    </script>
</body>
</html>
