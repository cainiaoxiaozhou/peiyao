<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>响水美食抽奖</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #ff512f 0%, #dd2476 55%, #7b2ff7 100%);
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 60px; }

  /* 顶部 */
  header { text-align: center; padding: 20px 0 8px; }
  .mall-tag {
    display: inline-block; font-size: 12px; letter-spacing: 2px;
    background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35);
    padding: 4px 14px; border-radius: 999px; margin-bottom: 12px;
  }
  h1 { font-size: 26px; letter-spacing: 1px; text-shadow: 0 3px 10px rgba(0,0,0,.25); }
  .sub { font-size: 13px; opacity: .85; margin-top: 6px; }

  /* 统计卡 */
  .stats { display: flex; gap: 8px; margin: 22px 0; }
  .stat-card {
    flex: 1; background: rgba(255,255,255,.14); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.22); border-radius: 14px;
    padding: 12px 4px; text-align: center;
  }
  .stat-num { font-size: 24px; font-weight: 800; color: #ffe259; }
  .stat-label { font-size: 11px; opacity: .85; margin-top: 4px; white-space: nowrap; }

  /* 抽奖区 */
  .lottery {
    background: rgba(255,255,255,.97); border-radius: 22px;
    padding: 22px 16px 24px; text-align: center; color: #333;
    box-shadow: 0 16px 40px rgba(0,0,0,.28);
    position: relative; overflow: hidden;
  }
  .lottery::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% -20%, rgba(255,213,79,.35), transparent 55%);
    pointer-events: none;
  }
  /* 范围切换 */
  .tabs {
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    margin-bottom: 16px; position: relative; z-index: 1;
  }
  .tab {
    border: 1.5px solid #f0c0d0; background: #fff; color: #dd2476;
    font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 999px;
    cursor: pointer; transition: all .2s;
  }
  .tab.on {
    background: linear-gradient(90deg, #ff512f, #dd2476);
    color: #fff; border-color: transparent;
  }
  .display {
    height: 96px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
  }
  .store-name {
    font-size: 28px; font-weight: 900; color: #dd2476;
    transition: transform .12s;
  }
  .store-cat { font-size: 13px; color: #999; letter-spacing: 2px; }
  .draw-btn {
    margin-top: 18px; width: 100%; border: none; cursor: pointer;
    background: linear-gradient(90deg, #ff512f, #dd2476);
    color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 4px;
    padding: 15px 0; border-radius: 999px;
    box-shadow: 0 8px 20px rgba(221,36,118,.45);
    transition: transform .15s, opacity .2s;
    position: relative; z-index: 1;
  }
  .draw-btn:active { transform: scale(.96); }
  .draw-btn:disabled { opacity: .6; }
  .tip { font-size: 12px; color: #bbb; margin-top: 12px; }

  /* 结果高亮 */
  @keyframes pop {
    0% { transform: scale(.4); } 60% { transform: scale(1.12); } 100% { transform: scale(1); }
  }
  .win .store-name { animation: pop .45s ease; color: #ff512f; }

  /* 店铺列表（可折叠） */
  details { margin-top: 24px; }
  summary {
    list-style: none; cursor: pointer; text-align: center;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 10px 0; font-size: 14px; font-weight: 600;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: " ▾"; }
  details[open] summary::after { content: " ▴"; }
  h2 { font-size: 16px; margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: #ffe259; }
  h2 small { font-size: 12px; opacity: .7; font-weight: normal; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .store {
    background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.2);
    border-radius: 14px; padding: 12px 14px;
  }
  .store b { font-size: 14px; display: block; }
  .store span { font-size: 11px; opacity: .75; }
  footer { text-align: center; font-size: 11px; opacity: .6; margin-top: 30px; line-height: 1.8; }

  /* 彩带粒子 */
  .confetti { position: fixed; top: -10px; z-index: 99; pointer-events: none; border-radius: 2px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mall-tag">江苏 · 盐城 · 响水</div>
    <h1>响水美食抽奖</h1>
    <div class="sub">爱琴海 · 金街 · 县城 · 开发区 · 亚美附近<br>今天吃什么？让命运来决定 🍜</div>
  </header>

  <div class="stats">
    <div class="stat-card"><div class="stat-num" id="totalNum">0</div><div class="stat-label">美食店铺</div></div>
    <div class="stat-card"><div class="stat-num" id="areaNum">0</div><div class="stat-label">覆盖区域</div></div>
    <div class="stat-card"><div class="stat-num" id="drawNum">0</div><div class="stat-label">已抽次数</div></div>
  </div>

  <div class="lottery" id="lotteryBox">
    <div class="tabs" id="tabs">
      <button class="tab on" data-scope="all" onclick="setScope('all', this)">全部</button>
    </div>
    <div class="display">
      <div class="store-name" id="storeName">点击开始</div>
      <div class="store-cat" id="storeCat">GOOD LUCK</div>
    </div>
    <button class="draw-btn" id="drawBtn" onclick="startDraw()">开始抽奖</button>
    <div class="tip">可切换抽奖范围，随机抽一家，抽中什么吃什么</div>
  </div>

  <details>
    <summary id="listSummary">查看全部店铺</summary>
    <div id="sections"></div>
  </details>

  <footer>
    数据来源：爱琴海集团官网、响水县政府网、携程、高德及公开地图信息<br>店铺信息以实际营业为准
  </footer>
</div>

<script>
// 区域配置
const LOCS = [
  { key: "mall",   name: "爱琴海",   title: "爱琴海购物中心", desc: "东海路29号" },
  { key: "street", name: "金街",     title: "金街",           desc: "商业街 · 夜市小吃" },
  { key: "city",   name: "县城",     title: "县城热门",       desc: "滨江路 · 双园路 · 华都不夜城等" },
  { key: "dev",    name: "开发区",   title: "开发区",         desc: "开源路 · 和谐路等" },
  { key: "yamei",  name: "亚美附近", title: "亚美国际附近",   desc: "幸福路 · 淮河路" },
];

// 响水美食店铺（公开信息整理）
const stores = [
  // 爱琴海购物中心
  { name: "鸿姐老火锅", cat: "火锅", loc: "mall" },
  { name: "周大厨辣椒炒肉", cat: "中式正餐", loc: "mall" },
  { name: "小菜园", cat: "中式正餐", loc: "mall" },
  { name: "家有川菜", cat: "中式正餐", loc: "mall" },
  { name: "醉清楼", cat: "中式正餐", loc: "mall" },
  { name: "蛙喔炭烧牛蛙", cat: "特色菜", loc: "mall" },
  { name: "半天妖烤鱼", cat: "烤鱼", loc: "mall" },
  { name: "大奇嘟嘟煲", cat: "煲类", loc: "mall" },
  { name: "小城煲腊味煲仔饭", cat: "煲仔饭", loc: "mall" },
  { name: "排骨先生", cat: "中式快餐", loc: "mall" },
  { name: "厚岛自助烤肉", cat: "自助烤肉", loc: "mall" },
  { name: "夏威夷海鲜自助", cat: "自助餐", loc: "mall" },
  { name: "肯德基·爱琴海店", cat: "西式快餐", loc: "mall" },
  { name: "必胜客", cat: "西式快餐", loc: "mall" },
  { name: "星巴克", cat: "咖啡", loc: "mall" },
  { name: "霸王茶姬", cat: "茶饮", loc: "mall" },
  { name: "蜜雪冰城", cat: "茶饮", loc: "mall" },
  { name: "悸动烧仙草", cat: "甜品饮品", loc: "mall" },
  { name: "松枝诺甜品", cat: "甜品", loc: "mall" },
  { name: "意式手工冰淇淋", cat: "冰淇淋", loc: "mall" },
  // 金街
  { name: "深海烤鱼", cat: "烤鱼", loc: "street" },
  { name: "芝根芝底披萨", cat: "披萨", loc: "street" },
  { name: "蜀城火锅", cat: "火锅", loc: "street" },
  { name: "糯雅芳粥", cat: "粥品小吃", loc: "street" },
  { name: "周黑鸭", cat: "卤味", loc: "street" },
  { name: "特色炸串", cat: "夜市小吃", loc: "street" },
  { name: "长沙臭豆腐", cat: "夜市小吃", loc: "street" },
  { name: "北京爆肚", cat: "夜市小吃", loc: "street" },
  { name: "狼牙土豆", cat: "夜市小吃", loc: "street" },
  { name: "手工冰粉", cat: "甜品", loc: "street" },
  { name: "特色铁板烧", cat: "夜市小吃", loc: "street" },
  { name: "苏豫记鸡柳烧饼", cat: "烧饼", loc: "street" },
  // 县城
  { name: "春海酸菜鱼", cat: "川菜·本地名店", loc: "city" },
  { name: "辣荘重庆老火锅", cat: "火锅", loc: "city" },
  { name: "蛙来了美蛙鱼头", cat: "火锅", loc: "city" },
  { name: "老粮票大食堂", cat: "中式快餐", loc: "city" },
  { name: "周记砂锅麻辣烫", cat: "麻辣烫", loc: "city" },
  { name: "肯德基·黄海路店", cat: "西式快餐", loc: "city" },
  { name: "7分甜", cat: "茶饮", loc: "city" },
  { name: "千代香烘焙", cat: "烘焙", loc: "city" },
  { name: "爱丽丝面包工坊", cat: "烘焙", loc: "city" },
  { name: "百汇餐车烧烤", cat: "烧烤", loc: "city" },
  { name: "肉夹馍餐车", cat: "小吃", loc: "city" },
  { name: "卷煎饼餐车", cat: "小吃", loc: "city" },
  { name: "阿妈早茶", cat: "早茶", loc: "city" },
  { name: "李氏烧烤龙虾", cat: "烧烤龙虾", loc: "city" },
  { name: "锦州御烧烤", cat: "烧烤", loc: "city" },
  { name: "鱼鼎记·双园路店", cat: "鱼火锅", loc: "city" },
  { name: "重庆天方老鸭汤", cat: "汤锅", loc: "city" },
  { name: "兰州牛肉拉面·双园路", cat: "面馆", loc: "city" },
  { name: "开心一刻饭店", cat: "家常菜", loc: "city" },
  { name: "姐妹饭店", cat: "家常菜", loc: "city" },
  { name: "东台鱼汤面私房菜", cat: "面食私房菜", loc: "city" },
  { name: "舒心酒家", cat: "家常菜", loc: "city" },
  // 开发区
  { name: "江南面馆·和欣公馆", cat: "面馆快餐", loc: "dev" },
  { name: "品香源餐厅", cat: "中式正餐", loc: "dev" },
  { name: "百香源黄焖鸡", cat: "黄焖鸡", loc: "dev" },
  { name: "沙县小吃·新客站店", cat: "小吃", loc: "dev" },
  { name: "肖记牛肉面馆", cat: "面馆", loc: "dev" },
  { name: "得鑫酒楼", cat: "正餐酒楼", loc: "dev" },
  { name: "食之味鸭血粉丝", cat: "粉丝汤", loc: "dev" },
  // 亚美附近
  { name: "如意馄饨·亚美店", cat: "馄饨", loc: "yamei" },
  { name: "京味源时尚餐厅", cat: "中餐", loc: "yamei" },
  { name: "华莱士·幸福店", cat: "西式快餐", loc: "yamei" },
  { name: "扇贝王海鲜烧烤", cat: "海鲜烧烤", loc: "yamei" },
  { name: "喜茶·润生广场店", cat: "茶饮", loc: "yamei" },
  { name: "塔斯汀中国汉堡", cat: "西式快餐", loc: "yamei" },
  { name: "哆米饭团寿司", cat: "寿司", loc: "yamei" },
  { name: "翡翠明珠美食馆", cat: "中式正餐", loc: "yamei" },
  { name: "创想酸菜鱼", cat: "川菜", loc: "yamei" },
  { name: "今晚打老虎", cat: "牛蛙", loc: "yamei" },
];

const LOC_MAP = Object.fromEntries(LOCS.map(l => [l.key, l]));
let drawCount = 0, drawing = false, scope = "all";

// 按区域分组
const byLoc = {};
LOCS.forEach(l => byLoc[l.key] = stores.filter(s => s.loc === l.key));

// 初始化统计
document.getElementById("totalNum").textContent = stores.length;
document.getElementById("areaNum").textContent = LOCS.length;

// 生成范围标签
const tabsEl = document.getElementById("tabs");
LOCS.forEach(l => {
  const b = document.createElement("button");
  b.className = "tab";
  b.textContent = l.name;
  b.onclick = () => setScope(l.key, b);
  tabsEl.appendChild(b);
});

// 生成店铺分区块
const secEl = document.getElementById("sections");
LOCS.forEach(l => {
  const sec = document.createElement("div");
  sec.className = "loc-section";
  sec.id = "sec-" + l.key;
  sec.innerHTML = `<h2>${l.title} <small>${l.desc} · ${byLoc[l.key].length}家</small></h2>`;
  const grid = document.createElement("div");
  grid.className = "grid";
  byLoc[l.key].forEach(s => {
    const d = document.createElement("div");
    d.className = "store";
    d.innerHTML = `<b>${s.name}</b><span>${s.cat}</span>`;
    grid.appendChild(d);
  });
  sec.appendChild(grid);
  secEl.appendChild(sec);
});

// 切换抽奖范围
function setScope(s, btn) {
  if (drawing) return;
  scope = s;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("on"));
  btn.classList.add("on");
  // 只展示所选区域的店铺列表
  document.querySelectorAll(".loc-section").forEach(el => {
    el.style.display = (s === "all" || el.id === "sec-" + s) ? "" : "none";
  });
  document.getElementById("listSummary").textContent =
    s === "all" ? `查看全部 ${stores.length} 家店铺` : `查看${LOC_MAP[s].name}店铺（${byLoc[s].length}家）`;
}

function getPool() {
  return scope === "all" ? stores : byLoc[scope];
}

function startDraw() {
  if (drawing) return;
  drawing = true;
  const pool = getPool();
  const btn = document.getElementById("drawBtn");
  const nameEl = document.getElementById("storeName");
  const catEl = document.getElementById("storeCat");
  const box = document.getElementById("lotteryBox");
  btn.disabled = true;
  btn.textContent = "抽奖中…";
  box.classList.remove("win");

  const target = Math.floor(Math.random() * pool.length);
  let i = 0, speed = 60;
  const total = 26 + target; // 滚动轮数

  (function roll() {
    const s = pool[i % pool.length];
    nameEl.textContent = s.name;
    catEl.textContent = s.cat + " · " + LOC_MAP[s.loc].name;
    i++;
    if (i < total) {
      // 末尾减速
      if (i > total - 8) speed += 45;
      setTimeout(roll, speed);
    } else {
      // 定格结果
      const win = pool[target];
      nameEl.textContent = win.name;
      catEl.textContent = win.cat + " · " + LOC_MAP[win.loc].name;
      box.classList.add("win");
      drawCount++;
      document.getElementById("drawNum").textContent = drawCount;
      btn.disabled = false;
      btn.textContent = "再抽一次";
      drawing = false;
      launchConfetti();
    }
  })();
}

// 初始化摘要文字
document.getElementById("listSummary").textContent = `查看全部 ${stores.length} 家店铺`;

// 彩带庆祝
function launchConfetti() {
  const colors = ["#ffe259", "#ff512f", "#dd2476", "#7b2ff7", "#4cd964", "#5ac8fa"];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    const size = 6 + Math.random() * 6;
    c.style.cssText = `left:${Math.random() * 100}vw;width:${size}px;height:${size * .5}px;background:${colors[i % 6]};`;
    document.body.appendChild(c);
    c.animate([
      { transform: "translateY(0) rotate(0deg)", opacity: 1 },
      { transform: `translateY(100vh) rotate(${360 + Math.random() * 360}deg)`, opacity: 0 }
    ], { duration: 1600 + Math.random() * 1200, easing: "ease-in" })
    .onfinish = () => c.remove();
  }
}
</script>
</body>
</html>
