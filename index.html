<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>门禁事件查询</title>
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a0ca3;
            --primary-light: #4895ef;
            --secondary: #f72585;
            --success: #4cc9f0;
            --warning: #f77f00;
            --dark: #212529;
            --light: #f8f9fa;
            --gray: #6c757d;
            --card-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            --card-shadow-hover: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            min-height: 100vh;
            color: var(--dark);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
        }

        .close-modal:hover {
            color: #ccc;
        }

        h1 {
            font-size: 2.8rem;
            color: var(--primary-dark);
            margin-bottom: 15px;
            font-weight: 700;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--primary-light);
            border-radius: 2px;
        }

        .subtitle {
            color: var(--gray);
            font-size: 1.1rem;
            font-weight: 300;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            padding: 30px;
            margin-bottom: 30px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-shadow-hover);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .card-title {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 500;
            display: flex;
            align-items: center;
        }

        .card-title i {
            margin-right: 12px;
            font-size: 1.8rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--primary-dark);
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-control:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
            outline: none;
            background: white;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-right: 10px;
        }

        .btn i {
            margin-right: 8px;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--gray);
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: var(--secondary);
        }

        .btn-danger:hover {
            background: #d1145a;
        }

        .token-display {
            background: rgba(76, 201, 240, 0.1);
            border-radius: 8px;
            padding: 20px;
            margin-top: 25px;
            border-left: 4px solid var(--success);
            position: relative;
            overflow: hidden;
        }

        .token-display::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--success);
        }

        .token-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px currentColor;
        }

        .status-connected {
            background: var(--success);
            color: var(--success);
        }

        .status-disconnected {
            background: var(--secondary);
            color: var(--secondary);
        }

        .token-value {
            font-family: 'Courier New', Courier, monospace;
            word-break: break-all;
            color: var(--primary-dark);
            font-weight: 500;
            background: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 6px;
            border: 1px dashed var(--primary-light);
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .alert-danger {
            background: rgba(247, 37, 133, 0.1);
            color: var(--secondary);
            border-left: 4px solid var(--secondary);
        }

        .alert-success {
            background: rgba(76, 201, 240, 0.1);
            color: var(--success);
            border-left: 4px solid var(--success);
        }

        .alert i {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            margin-top: 30px;
        }

        th {
            background: var(--primary);
            color: white;
            font-weight: 500;
            padding: 16px;
            text-align: left;
            position: sticky;
            top: 0;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #e9ecef;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        tr:hover {
            background-color: #e9f0ff;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
        }

        .pagination-info {
            margin: 0 20px;
            font-size: 0.95rem;
            color: var(--gray);
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(67, 97, 238, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .img-preview {
            max-width: 200px;
            max-height: 200px;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .img-preview:hover {
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 8px;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            h1 {
                font-size: 2rem;
            }

            .card {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            th,
            td {
                padding: 12px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>门禁事件查询</h1>
            <p class="subtitle">实时监控与分析门禁通行记录</p>
        </header>

        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    <i>🔐</i> 用户认证
                    <i id="usernames"></i>
                </div>

            </div>



            <div class="form-grid">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" class="form-control" placeholder="请输入工号" value="">
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" class="form-control" placeholder="请输入密码">
                </div>
            </div>
            <div id="errorMsg" class="alert alert-danger" style="display: none;">
                <i>⚠️</i>
                <div id="errorMsgContent"></div>
            </div>
            <button id="loginBtn" class="btn">
                <i>🔑</i> 登录并获取 Token
            </button>

            <div id="tokenResult" class="token-display" style="display: none;">
                <div class="token-header">
                    <span class="status-indicator status-connected"></span>
                    <strong>认证成功</strong>
                </div>
                <div class="token-value" id="tokenValue"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    <i>🔍</i> 查询条件
                </div>
            </div>

            <div id="error" class="alert alert-danger" style="display: none;">
                <i>⚠️</i>
                <div id="errorContent"></div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="secretNey">认证 Token</label>
                    <input type="text" id="secretNey" class="form-control" placeholder="请输入认证 Token">
                </div>

                <div class="form-group">
                    <label for="personName">姓名</label>
                    <input type="text" id="personName" class="form-control" placeholder="请输入姓名">
                </div>

                <div class="form-group">
                    <label for="limit">每页条数</label>
                    <select id="limit" class="form-control">
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="500">500</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <button onclick="searchData()" class="btn">
                    <i>🔍</i> 查询
                </button>
                <!-- <button onclick="resetForm()" class="btn btn-secondary">
                    <i>🔄</i> 重置
                </button> -->
            </div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>正在加载数据，请稍候...</p>
        </div>

        <div class="card" style="overflow-x: auto;">
            <div class="card-header">
                <div class="card-title">
                    <i>📋</i> 查询结果
                </div>
            </div>

            <table id="resultTable">
                <thead>
                    <tr>
                        <th style="width: 170px;">时间</th>
                        <th style="width: 100px;">姓名</th>
                        <th>图片</th>
                        <th>地点</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 数据将通过JavaScript动态填充 -->
                </tbody>
            </table>

            <div class="pagination">
                <button id="prevPage" onclick="changePage(-1)" class="btn btn-secondary">
                    <i>◀</i> 上一页
                </button>
                <span id="pageInfo" class="pagination-info">第 1 页</span>
                <button id="nextPage" onclick="changePage(1)" class="btn btn-secondary">
                    下一页 <i>▶</i>
                </button>
            </div>
        </div>
    </div>

    <!-- 图片预览模态框 -->
    <div id="imageModal" class="modal" style="display: none;">
        <span class="close-modal" onclick="closeImageModal()">&times;</span>
        <div class="modal-content">
            <img id="modalImage" src="" style="max-width: 90vw; max-height: 90vh;">
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const loginBtn = document.getElementById("loginBtn");
            loginBtn.addEventListener("click", async function () {
                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;
                const resultDiv = document.getElementById("tokenResult");
                const tokenValue = document.getElementById("tokenValue");
                const errorMsg = document.getElementById("errorMsg");
                errorMsg.textContent = "";
                resultDiv.style.display = "none";
                if (!username || !password) {
                    errorMsg.textContent = "请输入用户名和密码！";
                    errorMsg.style.display = "block";
                    return;
                } else {
                    errorMsg.style.display = "none";
                }

                try {
                    this.textContent = "登录中...";
                    this.disabled = true;
                    // errorMsg.style.display = "none";;

                    // 使用fetch获取HTML响应而不是JSON
                    const response = await fetch("https://sso.delong-grp.com/authorize", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded",
                        },
                        body: new URLSearchParams({
                            account: username,
                            password: password,
                            redirectUrl: "https://tms.delong-grp.com/tms/reservation/approval"
                        })
                    });

                    // 获取HTML文本
                    const html = await response.text();

                    // 创建临时DOM解析HTML
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, "text/html");

                    // 提取隐藏字段的值
                    const authToken = doc.getElementById("Admin_Center_SSO_Authorization")?.value;
                    const domain = doc.getElementById("domain")?.value;
                    if (authToken) {
                        // 创建一个函数来请求员工信息接口
                        async function fetchEmployeeInfo() {
                            const url = 'https://bid.delong-grp.com/api/bab/employee/info';

                            try {
                                const response = await fetch(url, {
                                    method: 'GET', // 根据实际情况可能是 POST 或其他方法
                                    headers: {
                                        'Admin_Center_SSO_Authorization': authToken,
                                        'Content-Type': 'application/json', // 根据需要添加其他头
                                    },
                                    // 如果有请求体，可以在这里添加
                                    // body: JSON.stringify({...}),
                                });
                                if (!response.ok) {
                                    throw new Error(`HTTP error! status: ${response.status}`);
                                }
                                const data = await response.json();
                                // 在这里处理返回的员工信息数据
                                return data;
                            } catch (error) {
                                // 在这里处理错误
                                throw error;
                            }
                        }
                        // 调用函数
                        fetchEmployeeInfo()
                            .then(data => {
                                // 处理成功返回的数据
                                document.getElementById('usernames').innerHTML = ': ' + data.data.employeeInfo.name;
                            })
                            .catch(error => {
                                // 处理错误
                            });
                        // 显示Token
                        tokenValue.textContent = authToken;
                        document.getElementById('secretNey').value = authToken;
                        resultDiv.style.display = "block";
                        // 存储到本地
                        localStorage.setItem("sso_token", authToken);
                        // 如果需要设置cookie
                        document.cookie = `Admin_Center_SSO_Authorization=${authToken}; path=/; domain=${domain}`;
                    } else {
                        const errorMsg = document.getElementById("errorMsg");
                        errorMsg.textContent = "请检查密码是否错误";
                        errorMsg.style.display = "block";
                    }

                } catch (error) {
                    errorMsg.textContent = `登录失败: ${error.message}`;
                } finally {
                    this.textContent = "登录并获取Token";
                    this.disabled = false;
                }
            });
        });
        // 当前页码
        let currentPage = 1;
        // 总数据量
        let totalItems = 0;
        // 每页显示数量
        let itemsPerPage = 10;
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('limit').value = itemsPerPage;
            // searchData();
        });

        // 搜索数据
        function searchData() {
            currentPage = 1;
            fetchData();
        }

        // 改变页码
        function changePage(offset) {
            currentPage += offset;
            if (currentPage < 1) currentPage = 1;
            fetchData();
        }

        // 获取数据 (POST方式)
        function fetchData() {
            const personName = document.getElementById('personName').value;
            const secretNey = document.getElementById('secretNey').value;
            itemsPerPage = parseInt(document.getElementById('limit').value);
            if (secretNey == '') {
                alert("请输入Token")
                // errorMsg.style.display = "block";
                return;
            }
            // 显示加载中
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').textContent = '';

            // 准备POST请求数据
            const requestData = {
                limit: itemsPerPage,
                page: currentPage,
                personName: personName,
            };

            // 发送POST请求
            fetch('https://tms.delong-grp.com/api/tab/hikvision-cross-record/acsDoorEvents', {
                method: 'POST',
                headers: {
                    'Admin_Center_SSO_Authorization': secretNey,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestData)
            })
                .then(response => {

                    if (!response.ok) {
                        throw new Error('网络响应不正常: ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    updatePageInfo(data);
                    populateTable(data.data.data.list || []);
                })
                .catch(error => {
                    document.getElementById('error').textContent = '获取数据失败: ' + error.message;
                })
                .finally(() => {
                    document.getElementById('loading').style.display = 'none';
                });
        }

        // 更新分页信息
        function updatePageInfo(data) {
            totalItems = data.data.data.total || 0;
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            document.getElementById('pageInfo').textContent =
                `第 ${currentPage} 页 / 共 ${totalPages} 页 (共 ${totalItems} 条记录)`;
            document.getElementById('prevPage').disabled = currentPage <= 1;
            document.getElementById('nextPage').disabled =
                currentPage >= totalPages || totalPages === 0;
        }
        function populateTable(items) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            if (items.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `
            <td colspan="4" style="text-align: center; color: var(--gray);">
                没有找到匹配的记录
            </td>
        `;
                tableBody.appendChild(row);
                return;
            }

            items.forEach(item => {
                const row = document.createElement('tr');
                const eventTime = item.eventTime ? item.eventTime.slice(0, 16).replace('T', ' ') : '';
                const personName = item.personName || '未知';
                const devName = item.devName || '未知地点';

                let imageCell = '无图片';
                if (item.picUri) {
                    const imageUrl = `https://ics.delong-grp.com/${item.picUri}`;
                    imageCell = `
                <img src="${imageUrl}" 
                     alt="门禁图片" 
                     class="img-preview"
                     style="max-width: 200px; max-height: 100px; cursor: pointer;"
                     onclick="showImageModal('${imageUrl}')">
            `;
                }

                row.innerHTML = `
            <td>${eventTime}</td>
            <td>${personName}</td>
            <td>${imageCell}</td>
            <td>${devName}</td>
        `;
                tableBody.appendChild(row);
            });
        }

        // 图片预览模态框相关函数
        function showImageModal(imageUrl) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');

            modal.style.display = 'flex';
            modalImg.src = imageUrl;
        }

        function closeImageModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        // 点击模态框外部关闭
        document.getElementById('imageModal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeImageModal();
            }
        });


    </script>
</body>

</html>
