<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>门禁事件查询</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1500px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .search-form {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 100px;
            font-weight: bold;
        }
        input[type="text"], select {
            padding: 8px;
            width: 200px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #409eff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #66b1ff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .pagination {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        .pagination button {
            margin: 0 5px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>门禁事件查询</h1>
        
        <div class="search-form">
            <div class="form-group">
                <label for="secretNey">秘钥：</label>
                <input type="text" id="secretNey" value="">
                <label for="personName">姓名：</label>
                <input type="text" id="personName" value="">
            </div>
            <div class="form-group">
                <label for="limit">每页条数：</label>
                <select id="limit">
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="100" >100</option>
                    <option value="500">500</option>
                </select>
            </div>
            <button onclick="searchData()">查询</button>
            <div id="error" class="error"></div>
        </div>
        
        <div id="loading" class="loading">加载中...</div>
        
        <table id="resultTable">
            <thead>
                <tr>
                    <th style="width: 170px;" >时间</th>
                    <th style="width: 100px;">姓名</th>
                    <th>图片地址</th>
                    <th>地点</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
        
        <div class="pagination">
            <button id="prevPage" onclick="changePage(-1)">上一页</button>
            <span id="pageInfo">第 1 页</span>
            <button id="nextPage" onclick="changePage(1)">下一页</button>
        </div>
    </div>

    <script>
        // 当前页码
        let currentPage = 1;
        // 总数据量
        let totalItems = 0;
        // 每页显示数量
        let itemsPerPage = 10;

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('limit').value = itemsPerPage;
            searchData();
        });

        // 搜索数据
        function searchData() {
            currentPage = 1;
            fetchData();
        }

        // 改变页码
        function changePage(offset) {
            currentPage += offset;
            if (currentPage < 1) currentPage = 1;
            fetchData();
        }

        // 获取数据 (POST方式)
        function fetchData() {
            const personName = document.getElementById('personName').value;
            const secretNey = document.getElementById('secretNey').value;
            itemsPerPage = parseInt(document.getElementById('limit').value);
            
            // 显示加载中
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').textContent = '';
            
            // 准备POST请求数据
            const requestData = {
                limit: itemsPerPage,
                page: currentPage,
                personName: personName,
            };
            
            // 发送POST请求
            fetch('http://10.2.2.20/api/tab/hikvision-cross-record/acsDoorEvents', {
                method: 'POST',
                headers: {
                    'Admin_Center_SSO_Authorization': secretNey,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestData)
            })
            .then(response => {

                if (!response.ok) {
                    throw new Error('网络响应不正常: ' + response.status);
                }
                return response.json();
            })
            .then(data => {
                updatePageInfo(data);
                populateTable(data.data.data.list || []);
            })
            .catch(error => {
                console.error('获取数据失败:', error);
                document.getElementById('error').textContent = '获取数据失败: ' + error.message;
            })
            .finally(() => {
                document.getElementById('loading').style.display = 'none';
            });
        }

        // 更新分页信息
        function updatePageInfo(data) {
            totalItems = data.data.data.total || 0;
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            document.getElementById('pageInfo').textContent = 
                `第 ${currentPage} 页 / 共 ${totalPages} 页 (共 ${totalItems} 条记录)`;
            document.getElementById('prevPage').disabled = currentPage <= 1;
            document.getElementById('nextPage').disabled = 
                currentPage >= totalPages || totalPages === 0;
        }

        // 填充表格数据
        function populateTable(items) {
    const tableBody = document.getElementById('tableBody');
    tableBody.innerHTML = '';
    items.forEach(item => {
        console.log(item.picUri);
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${item.eventTime ? item.eventTime.slice(0, 16) : ''}</td>
            <td>${item.personName || ''}</td>
            <td>${item.picUri ? `<img src="https://ics.delong-grp.com/${item.picUri}" alt="图片" style="max-width: 100px; max-height: 100px;">` : '无图片'}</td>
            <td>${item.devName || ''}</td>
        `;
        tableBody.appendChild(row);
    });
}
    </script>
</body>
</html>
