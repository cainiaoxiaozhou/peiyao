<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 粒子文字控制器 V2.0</title>
    <!-- 引入 Three.js 库 (用于 3D 渲染) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入 MediaPipe 库 (用于手势识别) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        /* ---------------- 3D 渲染 Canvas (全屏) ---------------- */
        #three-canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* ---------------- UI 元素 ---------------- */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: auto;
            text-align: left;
            pointer-events: none; 
            z-index: 10;
        }
        h1 {
            font-size: 2.2rem;
            margin: 0;
            background: linear-gradient(90deg, #00FFFF, #FF00FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0,255,255,0.5);
        }
        .mode-display {
            font-size: 1.5rem; /* 稍微缩小 */
            font-weight: bold;
            margin-top: 15px;
            text-shadow: 0 0 8px rgba(255,255,255,0.9);
            transition: color 0.3s, text-shadow 0.3s;
        }
        .instruction-list {
            margin-top: 25px;
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #00FFFF;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            pointer-events: auto;
        }
        .instruction-item {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        .key {
            font-weight: bold;
            color: #FFD700;
            margin-right: 12px;
            width: 40px;
            font-size: 1.2rem;
        }

        /* ---------------- 摄像头预览窗口 ---------------- */
        #camera-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 180px; 
            height: 135px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid rgba(0, 255, 255, 0.4);
            z-index: 20;
            background: #000;
            transform: scaleX(-1); 
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        #input_video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block; 
            position: absolute;
            opacity: 0.3; 
        }
        #output_canvas {
            width: 100%;
            height: 100%;
            display: block;
            position: relative;
        }

        /* 加载和调试状态 */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: #00FFFF;
            text-shadow: 0 0 15px #00FFFF;
            z-index: 100;
            display: block;
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border-radius: 15px;
            max-width: 80%;
            text-align: center;
            border: 2px solid #FF00FF;
        }

        /* 隐藏的 2D Canvas，用于文字采样 */
        #text-sampler {
            display: none;
        }
    </style>
</head>
<body>

    <canvas id="three-canvas"></canvas>
    <!-- 隐藏的 2D Canvas，用于将文字转换为像素数据 -->
    <canvas id="text-sampler" width="512" height="512"></canvas>

    <div id="loading">
        ⚡️ 正在启动 3D 粒子文字控制器... 
        <br>
        <small>（初始化摄像头和 3D 引擎中...）</small>
    </div>
    
    <div id="ui-container">
        <h1>手势文字魔法 V2.0 (粒子)</h1>
        <div id="current-mode" class="mode-display" style="color:#00FFFF;">初始化摄像头...</div>
        
        <div class="instruction-list">
            <div class="instruction-item"><span class="key">☝️</span> 1指 -> 陆</div>
            <div class="instruction-item"><span class="key">✌️</span> 2指 -> 知</div>
            <div class="instruction-item"><span class="key">🤟</span> 3指 -> 舟</div>
            <div class="instruction-item"><span class="key">🖐️</span> 4+指 -> 快乐</div>
            <div class="instruction-item"><span class="key">握拳</span> -> 隐藏/重置</div>
        </div>
    </div>

    <!-- 摄像头预览区域 -->
    <div id="camera-container">
        <video id="input_video" playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script>
        // --- 颜色配置 ---
        const TEXT_COLOR_MAP = {
            '陆': { r: 0.2, g: 0.5, b: 1.0, hex: 0x4169e1, glow: '#4169e1' }, // RoyalBlue
            '知': { r: 1.0, g: 0.2, b: 1.0, hex: 0xff00ff, glow: '#ff00ff' }, // Magenta
            '舟': { r: 1.0, g: 0.2, b: 0.0, hex: 0xff4500, glow: '#ff4500' }, // OrangeRed
            '快乐': { r: 1.0, g: 0.8, b: 0.1, hex: 0xffd700, glow: '#ffd700' }, // Gold
            'Wait': { r: 0.1, g: 0.9, b: 0.9, hex: 0x00ffff, glow: '#00ffff' } // 默认/等待颜色
        };
        
        // --- DOM 元素 ---
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingElement = document.getElementById('loading');
        const modeDisplayElement = document.getElementById('current-mode');

        // --- Three.js 变量 ---
        let scene, camera, renderer;
        let textPoints = null;
        let hands;
        const PARTICLE_SCALE_FACTOR = 0.05; // 粒子在屏幕上的缩放因子

        // --- 文本采样 Canvas ---
        const samplerCanvas = document.getElementById('text-sampler');
        const samplerCtx = samplerCanvas.getContext('2d');
        const SAMPLER_SIZE = 512;
        const PIXEL_STEP = 10; // 每隔 10 个像素点采样一个粒子，提高性能

        // -----------------------------------------------------------
        // 1. Three.js 初始化
        // -----------------------------------------------------------
        function initThreeJS() {
            const threeCanvas = document.getElementById('three-canvas');

            // 场景
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000000, 100, 500);

            // 摄像头
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 100;

            // 渲染器
            renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            
            // 响应式设计
            window.addEventListener('resize', onWindowResize, false);
            
            // 初始显示一个占位符
            createTextParticles('请伸出手', TEXT_COLOR_MAP.Wait);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // 粒子云的简单动画：自转
            if (textPoints) {
                textPoints.rotation.y += 0.005;
                textPoints.rotation.x = Math.sin(Date.now() * 0.0001) * 0.1;
            }

            renderer.render(scene, camera);
        }
        
        /**
         * 动态生成粒子几何体
         * @param {string} text 要渲染的文字
         * @param {object} colorConfig 颜色配置 {hex: 0xRRGGBB, glow: #RRGGBB}
         */
        function createParticlesFromText(text, colorConfig) {
            // 1. 清理旧粒子
            if (textPoints) {
                scene.remove(textPoints);
                textPoints.geometry.dispose();
                textPoints.material.dispose();
                textPoints = null;
            }
            
            if (!text) return; // 没有文字时直接返回

            // 2. 在 2D Canvas 上绘制文字
            samplerCtx.clearRect(0, 0, SAMPLER_SIZE, SAMPLER_SIZE);
            samplerCtx.font = "900 300px Inter, sans-serif";
            samplerCtx.fillStyle = '#FFFFFF'; // 使用白色绘制以便采样
            samplerCtx.textAlign = 'center';
            samplerCtx.textBaseline = 'middle';
            samplerCtx.fillText(text, SAMPLER_SIZE / 2, SAMPLER_SIZE / 2);

            // 3. 获取像素数据
            const imageData = samplerCtx.getImageData(0, 0, SAMPLER_SIZE, SAMPLER_SIZE).data;
            const positions = [];

            // 4. 采样像素点生成 3D 坐标
            for (let x = 0; x < SAMPLER_SIZE; x += PIXEL_STEP) {
                for (let y = 0; y < SAMPLER_SIZE; y += PIXEL_STEP) {
                    const i = (y * SAMPLER_SIZE + x) * 4;
                    // 检查像素点的红色通道 (R) 是否大于 128 (足够亮，即文字区域)
                    if (imageData[i] > 128) {
                        // 将 2D 坐标映射到 3D 空间
                        // 居中: (x - SAMPLER_SIZE/2) / scale, (SAMPLER_SIZE/2 - y) / scale
                        const x3D = (x - SAMPLER_SIZE / 2) * PARTICLE_SCALE_FACTOR;
                        const y3D = (SAMPLER_SIZE / 2 - y) * PARTICLE_SCALE_FACTOR;
                        // 随机添加Z轴深度，增强 3D 粒子感
                        const z3D = (Math.random() - 0.5) * 5; 

                        positions.push(x3D, y3D, z3D);
                    }
                }
            }

            // 5. 创建几何体和材质
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            
            // 使用发光材质和自定义着色器属性
            const material = new THREE.PointsMaterial({
                color: colorConfig.hex,
                size: 2.5, // 粒子大小
                sizeAttenuation: true, // 粒子随距离衰减
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending, // 叠加混合，实现辉光效果
                depthWrite: false // 不写入深度，防止奇怪的渲染伪影
            });

            textPoints = new THREE.Points(geometry, material);
            scene.add(textPoints);
        }

        // -----------------------------------------------------------
        // 2. MediaPipe Hands 初始化与核心逻辑
        // -----------------------------------------------------------
        function initMediaPipe() {
            hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1, 
                minDetectionConfidence: 0.7, 
                minTrackingConfidence: 0.7
            });

            hands.onResults(onResults);
            
            setupCamera().then(() => {
                loadingElement.style.display = 'none';
                modeDisplayElement.innerText = "✅ 摄像头已就绪，请伸出手掌";
                modeDisplayElement.style.color = "#00FF00";
                sendToMediaPipe(); 
            }).catch(error => {
                const errorMessage = `❌ 摄像头启动失败 (${error.name || '未知错误'})。`;
                loadingElement.innerHTML = `<span style="color: #FF4500; font-size: 1.8rem;">${errorMessage}</span>
                    <ul style="list-style: none; padding: 15px; margin-top: 15px; text-align: left; background: rgba(255, 69, 0, 0.1); border-radius: 8px;">
                        <li>1. 请检查您的浏览器是否**允许了摄像头权限**。</li>
                        <li>2. 摄像头是否被**其他程序**占用。</li>
                        <li>3. 尝试**刷新页面**再试一次。</li>
                    </ul>`;
                loadingElement.style.display = 'block';
                modeDisplayElement.innerText = "❌ 摄像头故障";
                modeDisplayElement.style.color = "#FF4500";
                console.error("Camera setup failed:", error);
            });
        }
        
        async function setupCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                return Promise.reject(new Error("浏览器不支持摄像头访问。"));
            }

            const stream = await navigator.mediaDevices.getUserMedia({
                'video': { facingMode: 'user' },
            });
            videoElement.srcObject = stream;
            
            return new Promise((resolve) => {
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    canvasElement.width = videoElement.videoWidth;
                    canvasElement.height = videoElement.videoHeight;
                    resolve();
                };
            });
        }

        async function sendToMediaPipe() {
            if (videoElement.paused || videoElement.ended) return;
            if (videoElement.readyState >= 2) {
                await hands.send({image: videoElement}); 
            }
            requestAnimationFrame(sendToMediaPipe);
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            let fingerCount = 0;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // 绘制骨骼到预览 Canvas 上
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(0, 255, 255, 0.7)', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF00FF', lineWidth: 1});

                fingerCount = countFingers(landmarks);
                updateStateByFingerCount(fingerCount);
            } else {
                updateStateByFingerCount(0); // 没有检测到手时
            }
            canvasCtx.restore();
        }
        
        /**
         * 统计向上伸出的手指数量 
         */
        function countFingers(landmarks) {
            let count = 0;
            // 简单判定：指尖 y 坐标小于指节 y 坐标 (y 轴向下增大)
            if (landmarks[8].y < landmarks[6].y) count++; // 食指
            if (landmarks[12].y < landmarks[10].y) count++; // 中指
            if (landmarks[16].y < landmarks[14].y) count++; // 无名指
            if (landmarks[20].y < landmarks[18].y) count++; // 小指
            
            // 额外检查：如果拇指尖 (4) 比手腕基部 (0) 更靠近顶部 (y 值更小)，算作伸出
            if (landmarks[4].y < landmarks[0].y - (landmarks[0].y - landmarks[9].y) * 0.5) count++; // 拇指

            return count;
        }

        /**
         * 根据手指数量切换 3D 粒子内容
         */
        function updateStateByFingerCount(count) {
            let textContent = '';
            let displayMode = '等待手势...';
            let targetColor = TEXT_COLOR_MAP.Wait;

            if (count === 1) {
                textContent = '陆';
                displayMode = "☝️ 陆之形";
                targetColor = TEXT_COLOR_MAP.陆;
            } 
            else if (count === 2) {
                textContent = '知';
                displayMode = "✌️ 知之形";
                targetColor = TEXT_COLOR_MAP.知;
            } 
            else if (count === 3) {
                textContent = '舟';
                displayMode = "🤟 舟之形";
                targetColor = TEXT_COLOR_MAP.舟;
            } 
            else if (count >= 4) { // 张开手掌 (4指或5指)
                textContent = '快乐';
                displayMode = "🖐️ 快乐";
                targetColor = TEXT_COLOR_MAP.快乐;
            } 
            else {
                // count === 0
                // 如果当前模式显示的是成功启动信息，则不覆盖
                if (modeDisplayElement.innerText.includes("✅")) {
                    displayMode = "✅ 摄像头已就绪，请伸出手掌";
                }
            }


            // 1. 更新 UI 文本 (仅在非故障状态下更新)
            if (!modeDisplayElement.innerText.includes("❌")) {
                modeDisplayElement.innerText = displayMode;
            }

            // 2. 控制 3D 粒子文字显示
            // 只有当文字内容变化时才重新生成粒子，避免卡顿
            if (textContent && (!textPoints || textPoints.userData.text !== textContent)) {
                createTextParticles(textContent, targetColor);
                if (textPoints) {
                    textPoints.userData.text = textContent; // 存储当前文字内容
                }
            } else if (!textContent && textPoints) {
                // 握拳或无手势时，隐藏文字并清理
                scene.remove(textPoints);
                textPoints.geometry.dispose();
                textPoints.material.dispose();
                textPoints = null;
            }
        }


        // 页面加载完成后，启动 MediaPipe 和 Three.js
        window.onload = function() {
            initThreeJS();
            initMediaPipe();
        };
    </script>
</body>
</html>
